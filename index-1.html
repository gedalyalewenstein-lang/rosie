<style>
/* Kitchen order pad: one working column, sticky date + tabs, sticky action bar */
:root{
  --bg:#F6F5F3; --paper:#FFFFFF; --ink:#18161A; --mute:#6F6A70; --line:#E3E0E2; --soft:#EFEDEE;
  --wine:#8C2B3E; --wine-soft:#F5E9EC; --ok:#2E6A4B; --ok-soft:#E5F1EA; --warn:#9A5B12; --warn-soft:#FBF0E1; --bad:#A3271B;
  --ui:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif; --disp:"Frank Ruhl Libre","David",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121113; --paper:#1B1A1D; --ink:#F1EEF0; --mute:#A39DA4; --line:#2E2C30; --soft:#252327;
  --wine:#E07A90; --wine-soft:#3A2129; --ok:#7CC9A0; --ok-soft:#1D3328; --warn:#E3AE68; --warn-soft:#3A2C18; --bad:#F08A7E; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{display:grid;place-items:center;min-height:80vh;color:var(--mute)}

/* login */
.auth{min-height:90vh;display:grid;place-items:center}
.card{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
.card h1{font-family:var(--disp);font-size:30px;margin:0}
.card p.sub{margin:4px 0 20px;color:var(--mute);font-size:13.5px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 8px}
.link{background:none;border:0;color:var(--wine);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.center{text-align:center;margin-top:14px;font-size:13.5px;color:var(--mute)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{font-family:var(--disp);font-size:24px;margin:0}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.who b{color:var(--ink);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;min-width:62px;text-align:center;font:inherit;cursor:pointer}
.day b{display:block;font-size:13px}
.day span{display:block;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.75}
.day:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-top:1px solid var(--line);overflow-x:auto}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--wine)}
main{padding-block:14px 110px}

.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.sent{background:var(--wine-soft);color:var(--wine)}
.pill.none{background:var(--soft);color:var(--mute)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
section.cat{margin-bottom:16px}
.cat h2{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--mute);margin:0 0 6px;display:flex;justify-content:space-between}
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:54px}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:600;display:block}
.row .nm small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.row.on{background:var(--wine-soft)}
.row.done{background:var(--ok-soft)}
.row.off{opacity:.5}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.step button{width:42px;height:42px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer}
.step button:active{background:var(--soft)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.check{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ok);font-size:22px;cursor:pointer;flex:0 0 auto}
.check:disabled{cursor:default}
.row.done .check{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.qty{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.qty small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.num{width:58px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:7px 4px;text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums}
.sel{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:7px 6px;font:inherit}
.label{font-size:12px;color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:fixed;inset:auto 0 0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.bar .sum{flex:1;min-width:0;font-size:13.5px}
.bar .sum b{font-size:17px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--wine);color:#fff}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--ok);transition:width .3s}
.empty{text-align:center;color:var(--mute);padding:36px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.form{display:grid;grid-template-columns:1fr 1fr 90px auto;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.form input,.form select{min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
@media (max-width:560px){.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}}
.note{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

const $ = (id) => document.getElementById(id);

  if (c.includes("too-many-requests")) return "יותר מדי ניסיונות. נסה שוב בעוד כמה דקות";

async function doLogin(e) {

}

async function ensureProfile(user) {

  await setDoc(ref, {

}

function stopAll() { Object.keys(unsub).forEach((k) => { if (unsub[k]) { unsub[k](); unsub[k] = null; } }); }

onAuthStateChanged(auth, async (user) => {

function startData() {

function bump(k, delta) {

}

  const batch = Object.assign({}, pending); if (!Object.keys(batch).length) return;
  writing = true;
  const body = { date: S.day, items: batch, updatedAt: Date.now(), updatedBy: myName() };
  if (S.order && S.order.sentAt) body.changedAfterSend = true;
  try {
    await setDoc(doc(db, "orders", S.day), body, { merge: true });
    Object.keys(batch).forEach((k) => { if (pending[k] === batch[k]) delete pending[k]; });
  } catch (e) { toast("לא נשמר — בדוק חיבור"); }
  writing = false; render();
  if (Object.keys(pending).length) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400); }
}

  if (S.tab === "order" && can.order()) {
    let n = 0, b = 0; items(true).forEach((it) => { const v = qtyOf(it.k); if (v) { n++; b += v; } });
    const sent = S.order && S.order.sentAt && !S.order.changedAfterSend && !Object.keys(pending).length;
    bar = `<div class="bar"><div class="wrap"><div class="sum"><b>${b}</b> קופסאות · ${n} הכנות</div><button class="btn" id="send" ${!n || sent ? "disabled" : ""}>${sent ? "נשלחה ✓" : S.order && S.order.sentAt ? "שלח עדכון" : "שלח הזמנה"}</button></div></div>`;
  }
  return `<header><div class="wrap"><div class="top"><h1 class="brand">רוזי</h1>
      <div class="who"><span><b>${esc(myName())}</b> · ${ROLES[role()] || ""}</span><button class="link" id="logout">יציאה</button></div></div>
      ${showDays ? `<div class="days" role="group" aria-label="יום משלוח">${days}</div>` : ""}</div>
    <div class="wrap"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join("")}</div></div></header>
    <main class="wrap">${body}</main>${bar}`;
}
function render() {
  const a = document.activeElement, fid = a && a.id; let sel = null;
  try { sel = a && a.selectionStart; } catch (e) {}
  let html;
  if (!S.user) html = viewAuth();
  else if (!S.profile) html = `<div class="splash">טוען…</div>`;
  else if (!["rosie", "prod", "admin"].includes(role())) html = viewWaiting();
  else html = viewApp();
  // keep typed login fields across re-render
  const keep = {}; ["n", "u", "p"].forEach((id) => { const el = $(id); if (el) keep[id] = el.value; });
  $("app").innerHTML = html;
  Object.keys(keep).forEach((id) => { const el = $(id); if (el) el.value = keep[id]; });
  if (fid) { const el = $(fid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
}

/* ---------- events ---------- */
const app = $("app");
app.addEventListener("submit", (e) => {
  if (e.target.id === "authF") return S.authMode === "signup" ? doSignup(e) : doLogin(e);
  if (e.target.id === "addF") {
    e.preventDefault();
    const n = $("nN").value.trim(), c = $("nC").value, d = parseInt($("nD").value, 10) || 4;
    if (n) addItem(n, c, d);
  }
});
app.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "swap") { S.authMode = S.authMode === "login" ? "signup" : "login"; S.authErr = ""; render(); }
  else if (t.id === "logout") { flush(); signOut(auth); }
  else if (t.dataset.day) { if (t.disabled) return; flush(); S.day = t.dataset.day; watchDay(); render(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.inc) bump(t.dataset.inc, 1);
  else if (t.dataset.dec) bump(t.dataset.dec, -1);
  else if (t.dataset.done) toggleDone(t.dataset.done);
  else if (t.dataset.toggle) { const it = items(true).find((x) => x.k === t.dataset.toggle); if (it) catWrite(it.k, { active: it.active === false }); }
  else if (t.id === "only") { S.onlyOrdered = !S.onlyOrdered; render(); }
  else if (t.id === "send") sendOrder();
});
app.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; render(); }
  else if (e.target.dataset.made) madeDraft[e.target.dataset.made] = e.target.value;
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.made) { setMade(t.dataset.made, t.value); delete madeDraft[t.dataset.made]; }
  else if (t.dataset.days) { const d = parseInt(t.value, 10); if (d > 0) catWrite(t.dataset.days, { d }); }
  else if (t.dataset.role) setRole(t.dataset.role, t.value);
});
setInterval(() => { const a = document.activeElement; if (S.user && !(a && a.tagName === "INPUT")) render(); }, 60000);
window.addEventListener("beforeunload", () => { if (Object.keys(pending).length) flush(); });
render();

</script>
</body>
</html>
