<style>
/* Rosie — "rose garden at night". Plum-night surfaces, petal-pink actions, leaf-green for done.
   Display numbers & brand: Secular One. Everything else: Assistant. Dark by default, day mode for bright kitchens. */
:root{
  --bg:#16121D; --paper:#1F1A28; --raise:#2A2335; --ink:#F5EFF7; --mute:#A99FB6; --line:#332B3F;
  --acc:#F49AB2; --acc-ink:#FFB8CA; --acc-soft:rgba(244,154,178,.13); --on-acc:#2B0E1A;
  --ok:#82D9AC; --ok-soft:rgba(130,217,172,.12); --on-ok:#0E2A1C;
  --warn:#F3C675; --warn-soft:rgba(243,198,117,.12);
  --bad:#FF8F80; --bad-soft:rgba(255,143,128,.13);
  --info:#A8BEFF; --info-soft:rgba(168,190,255,.12);
  --shadow:none; --lift:0 12px 40px rgba(0,0,0,.45);
  --rose1:#B84A68; --rose2:#F49AB2; --rose3:#FFD3DE;
  --ui:"Assistant","Arial Hebrew",Arial,sans-serif; --disp:"Secular One","Assistant",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F3F6; --paper:#FFFFFF; --raise:#F2ECF1; --ink:#24192B; --mute:#776B80; --line:#E9E0E7;
  --acc:#C8325A; --acc-ink:#A3264A; --acc-soft:#FBE8EE; --on-acc:#FFFFFF;
  --ok:#1F8A57; --ok-soft:#E4F4EB; --on-ok:#FFFFFF;
  --warn:#A8670A; --warn-soft:#FDF1DD; --bad:#BF3328; --bad-soft:#FCE9E6; --info:#2E62B0; --info-soft:#E8F0FB;
  --shadow:0 1px 2px rgba(36,25,43,.05),0 4px 14px rgba(36,25,43,.05); --lift:0 12px 36px rgba(36,25,43,.16);
  --rose1:#E9A3B6; --rose2:#C8325A; --rose3:#7E1734;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body.locked{overflow:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{display:grid;place-items:center;min-height:85vh}

/* petal logo + avatar */
.logo{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 14px}
.logo.sm{width:38px;height:38px;margin:0}
.rose{width:100%;height:100%;display:block;overflow:visible}
.rose .p1{fill:var(--rose1)}
.rose .p2{fill:var(--rose2)}
.rose .c{fill:var(--rose3)}
.rose .s{fill:none;stroke:var(--rose2);stroke-width:1.4;stroke-linecap:round}
.ci{flex:0 0 auto;color:var(--acc)}
.cat h2 > span:first-child{display:inline-flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.lg{width:52px;height:52px;font-size:18px;background:var(--acc-soft);color:var(--acc-ink);border:0}

/* login */
.auth{min-height:92vh;display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.authcard{width:100%;max-width:380px;padding:34px 24px 24px;text-align:center}
.authcard h1{font-family:var(--disp);font-weight:400;font-size:30px;margin:0}
.authcard .sub{margin:2px 0 24px;color:var(--mute);font-size:15px}
.authcard .field{text-align:start}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600;color:var(--mute)}
.field input,.field select,.notebox textarea,.ta{border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px}
.field input:focus,.notebox textarea:focus,.ta:focus,.search:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}
.link{background:none;border:0;color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.center{text-align:center;margin-top:16px;font-size:15px;color:var(--mute)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:11px}
.brand b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.1}
.brand small{display:block;color:var(--mute);font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.days::-webkit-scrollbar,.jump::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:7px 14px;min-width:66px;text-align:center;cursor:pointer}
.day b{display:block;font-size:14.5px;font-weight:700}
.day span{display:block;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.day[aria-pressed="true"] span{color:inherit;opacity:.75}
.dot{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.jump{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.jump button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.jump button:active{background:var(--raise)}
.jump i{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
main{padding-block:14px 130px}
body.has-tabbar main{padding-bottom:200px}
section.cat{scroll-margin-top:200px}

/* bottom tab bar */
.tabbar{position:fixed;inset:auto 0 0;z-index:7;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;position:relative;display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:14px}
.tab svg{padding:3px 14px;box-sizing:content-box;border-radius:999px}
.tab[aria-selected="true"]{color:var(--acc-ink)}
.tab[aria-selected="true"] svg{background:var(--acc-soft)}
.badge{position:absolute;top:2px;left:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--warn);color:#2A1C05;font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid var(--paper)}

/* status card + order journey */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 6%,var(--paper)),var(--paper) 60%);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.when b{display:block;font-size:18px;font-weight:800}
.when small{color:var(--mute);font-size:13.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--raise);color:var(--mute)}
.pill.open,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad);white-space:normal}
.track{flex-basis:100%;display:flex;list-style:none;margin:6px 0 0;padding:0}
.track li{flex:1;position:relative;display:grid;justify-items:center;gap:5px;font-size:12.5px;color:var(--mute);text-align:center}
.track li::before{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track i{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.track li.done{color:var(--ok)} .track li.done i{background:var(--ok);border-color:var(--ok)} .track li.done::before{background:var(--ok)}
.track li.now{color:var(--ink);font-weight:700} .track li.now i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.track li.bad{color:var(--bad);font-weight:700} .track li.bad i{background:var(--bad);border-color:var(--bad)}
.track li.warn{color:var(--warn)} .track li.warn i{background:var(--warn);border-color:var(--warn)}
.track li small{display:block;font-size:11.5px;font-weight:700;color:var(--warn)}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;text-align:start;font:inherit;color:var(--ink);background:var(--paper);border-radius:18px;padding:13px 15px;margin-bottom:10px;flex-wrap:wrap}
.banner > svg{flex:0 0 auto}
.banner > span:first-of-type{flex:1;min-width:180px;font-size:15px}
.banner i{font-style:normal;font-weight:700;color:var(--warn);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .banner.warn > svg{color:var(--warn)}
button.banner{cursor:pointer}
.banner.ok > svg{color:var(--ok)} .banner.ok.solid{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.info{background:var(--info-soft)} .banner.info > svg{color:var(--info)}
.banner.sugg{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent)} .banner.sugg > svg{color:var(--acc)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .banner.bad b{color:var(--bad)}
.bbtns{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.x{border:0;background:none;color:var(--mute);font-size:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.x:hover{background:var(--raise)}

/* tools */
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools.end{justify-content:center;margin-top:20px}
.search{flex:1 1 90px;min-width:0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit}
.search::placeholder,.ta::placeholder,textarea::placeholder,input::placeholder{color:var(--mute);opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip svg{color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] svg{color:inherit}
.notebox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:grid;gap:6px}
.notebox label{font-size:14px;font-weight:700;color:var(--mute)}
.notebox textarea{resize:vertical;min-height:54px}
.ta{resize:vertical}
.seg{display:inline-flex;gap:3px;background:var(--raise);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* lists */
section.cat{margin-bottom:20px}
.cat h2{font-size:15px;font-weight:800;color:var(--ink);margin:0 6px 8px;display:flex;justify-content:space-between;align-items:baseline}
.cat h2 .ct{font-weight:700;font-size:13.5px;color:var(--acc-ink)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:66px;transition:background .15s}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:700;display:block;font-size:16.5px;line-height:1.25}
.row .nm small{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.row.on{background:var(--acc-soft);box-shadow:inset -4px 0 0 var(--acc)}
.row.off{opacity:.45}
.okt{display:block;color:var(--ok)!important}
.step{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.step button{width:44px;height:44px;border:0;border-radius:50%;background:var(--raise);color:var(--ink);font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button:last-child{background:var(--acc);color:var(--on-acc)}
.step button:active{transform:scale(.92)}
.step button:disabled{opacity:.3;cursor:default;transform:none}
.step output{min-width:36px;text-align:center;font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
.row:not(.on) .step output{color:var(--mute);opacity:.6}
.step.sm button{width:36px;height:36px;font-size:19px}
.step.lg{justify-content:center;gap:18px}
.step.lg button{width:56px;height:56px;font-size:28px}
.step.lg output{font-size:34px;min-width:64px}
output.chg{color:var(--acc-ink)!important;opacity:1!important}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--mute);background:transparent;cursor:pointer;flex:0 0 auto;position:relative;opacity:.8}
.check::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);font-size:22px;font-weight:800;opacity:0;transition:opacity .15s}
.check:hover::after,.check:focus-visible::after{opacity:.6}
.check:active{background:var(--ok-soft);border-color:var(--ok)}
.check:disabled{cursor:default;opacity:.35}
.qty{font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center;line-height:1.1}
.qty small{display:block;font-family:var(--ui);font-weight:600;font-size:11.5px;color:var(--mute)}
.ahead{color:var(--info);font-weight:600}
.tag{font-style:normal;font-size:12.5px;font-weight:700;border-radius:8px;padding:1px 8px;display:inline-block;margin-top:3px}
.tag.new{background:var(--info-soft);color:var(--info)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.tag.down{background:var(--raise);color:var(--mute)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.lack{display:grid;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:var(--warn-soft)}
.lack b{color:var(--warn);font-size:15.5px}
.lack small{color:var(--mute);font-size:13.5px}
.lack .seg{display:flex}.lack .seg button{flex:1}
.num{width:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:9px 4px;text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.sel{border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:9px 10px;font:inherit}
.sel.full{width:100%;padding:13px;font-size:16px}

/* production */
.progress-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:15px}
.progress-card b{font-family:var(--disp);font-weight:400;font-size:20px}
.progress{height:10px;background:var(--raise);border-radius:99px;overflow:hidden;margin-top:9px}
.progress div{height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.hint{font-size:13.5px;color:var(--mute);margin:0 6px 12px}
.donebar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:15px;border-radius:18px;padding:14px 16px;cursor:pointer;margin-top:4px}
.donelist{margin-top:8px}
.drow{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:start;color:var(--ink);cursor:pointer;font:inherit}
.drow:first-child{border-top:0}
.drow .nm b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--mute)}
.tick{width:32px;height:32px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center;font-size:16px;font-weight:800;flex:0 0 auto}
.done-all{background:var(--ok-soft)!important;border-color:transparent!important;color:var(--ok)}
.done-all b{color:var(--ok)!important}

/* approval */
.approve{background:var(--paper);border-radius:22px;border:2px solid var(--warn);padding:16px;margin-bottom:14px}
.atop b{display:block;font-size:18px;font-weight:800}
.atop small{color:var(--mute);font-size:14px}
.anote{display:flex;gap:8px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0 0;font-size:15px}
.anote svg{color:var(--info);flex:0 0 auto;margin-top:3px}
.ahint{font-size:13.5px;color:var(--mute);margin:10px 0 0}
.alist{margin-top:8px}
.arow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-weight:700;display:block}
.arow .nm small{color:var(--mute);font-size:13px}
.abtns,.sbtns{display:flex;gap:8px;margin-top:16px}
.abtns .btn,.sbtns .btn{flex:1}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer;background:var(--acc);color:var(--on-acc);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.big{padding:15px 24px;font-size:17px}
.btn.ghost{background:var(--raise);color:var(--ink)}
.btn.okb{background:var(--ok);color:var(--on-ok)}
.btn.badb{background:var(--bad);color:#2A0B07}
:root[data-theme="light"] .btn.badb{color:#fff}
.btn.badt,.linkbtn.badt{color:var(--bad)}
.btn.small{padding:9px 15px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* bottom send bar */
.bar{position:fixed;inset:auto 0 0;z-index:6;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
body.has-tabbar .bar{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.barin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--raise);border:1px solid var(--line);border-radius:22px;padding:10px 10px 10px 16px;padding-inline-start:18px;box-shadow:var(--lift);pointer-events:auto}
.bar .sum{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px;font-size:15px}
.bar .sum b{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.bar .sum small{flex-basis:100%;color:var(--mute);font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,5,12,.6);z-index:20;animation:fade .15s}
.sheet{position:fixed;inset:auto 0 0;z-index:21;background:var(--paper);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 16px}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800}
.sheet .big{font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0 18px;color:var(--acc-ink)}
.sheet .hint{margin:10px 0 0;text-align:center}

/* data */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}

.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}

.kpi b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;margin:2px 0;line-height:1.15}
.kpi span{color:var(--mute);font-size:12.5px}
section.card{margin-bottom:14px;overflow:hidden}
.pad{padding:15px 16px}
.pad-x{padding-inline:16px}
section.card h3{font-size:16px;font-weight:800;margin:0 0 8px}

.chartbox{position:relative}
.ctip{font-size:13.5px;color:var(--mute);min-height:20px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:150px;display:block}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}

.clabels{display:flex;flex-direction:row;border-top:1px solid var(--line);padding-top:5px}
.clabels span{flex:1;min-width:0;font-size:11.5px;color:var(--mute);text-align:center;white-space:nowrap;overflow:visible}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--acc-ink);font-weight:700;padding:14px;cursor:pointer;font-size:15px}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1fr 54px 62px 84px;gap:8px;align-items:center;padding:11px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;width:100%}
.tr span:not(:first-child){text-align:center}

.tr.th{cursor:default;color:var(--mute);font-size:13px;font-weight:700;border-top:0;padding-block:6px}
.trx{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 12px;background:var(--raise)}
.trx span{background:var(--paper);border-radius:12px;padding:6px 10px;text-align:center;min-width:46px}
.trx span small{display:block;color:var(--mute);font-size:11.5px}
.trx span.wide{flex-basis:100%;text-align:start;background:none;padding:4px 0 0;color:var(--mute);font-size:13px}
.badv{color:var(--bad)} .warnv{color:var(--warn)} .nw{white-space:nowrap}
.shw{font-style:normal;color:var(--warn);font-weight:700}
.hist{display:grid}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;width:100%;cursor:pointer}
.hrow.static{cursor:default}
.hd{flex:1;min-width:120px}
.hd b{display:block;font-weight:700}
.hd small{color:var(--mute);font-size:13px}
.hq{font-family:var(--disp);font-size:20px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}

.hp{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%}
.hx{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px;background:var(--raise)}
.hx span{background:var(--paper);border-radius:10px;padding:5px 10px;font-size:14px}
.hx p{flex-basis:100%;margin:6px 0 0}
.ebtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ebtns .btn{flex:1 1 180px}
.vrow{display:flex;gap:8px;margin-top:10px}
.vrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;background:var(--raise);color:var(--ink)}

/* admin forms */
.form{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:8px;padding:12px;margin-bottom:16px}
.form input,.form select{min-width:0;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:12px;padding:11px;font:inherit}

.note{font-size:14px;color:var(--mute);margin:4px 6px 12px}
.empty{text-align:center;color:var(--mute);padding:38px 18px;background:var(--paper);border:1px dashed var(--line);border-radius:20px;margin-bottom:12px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--lift)}
.toast.show{opacity:1;transform:translateX(-50%)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tools.end .chip span{display:inline!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.banner.sugg .bbtns{flex-basis:100%;flex-wrap:wrap;margin:0}
.banner.sugg .bbtns .btn{flex:1 1 140px}

/* intro: service goals */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:10px;background:radial-gradient(120% 80% at 50% 35%,color-mix(in srgb,var(--acc) 14%,var(--bg)),var(--bg) 65%);transition:opacity .45s ease,transform .45s ease;cursor:pointer}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
#intro .in-rose{width:112px;height:112px;animation:spin 1.1s cubic-bezier(.2,.8,.2,1) both}
#intro .rose ellipse,#intro .rose circle{transform-box:fill-box;transform-origin:center;animation:bloom .6s cubic-bezier(.3,1.4,.5,1) both}
#intro .rose .c{animation-delay:.68s}
#intro .rose .s{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .5s .65s ease-out forwards}
#intro .in-word{font-family:var(--disp);font-size:44px;line-height:1;color:var(--ink);animation:rise .5s .55s both}
#intro .in-sub{color:var(--mute);font-size:15px;margin-top:-2px;animation:rise .5s .7s both}

@keyframes bloom{from{transform:scale(0);opacity:0}}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}

.rrow{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;cursor:pointer}

/* ---- ליטוש: נקי, יוקרתי, נעים. אותו מבנה ואותם כפתורים, רק תחושה ---- */
:root{
  --bg:#14101A; --paper:#1D1826; --raise:#272031; --line:rgba(255,255,255,.075);
  --edge:inset 0 1px 0 rgba(255,255,255,.045); --soft:0 10px 30px -12px rgba(0,0,0,.55);
  --r-card:22px; --r-tile:16px;
}
:root[data-theme="light"]{ --bg:#F8F4F7; --line:#EEE5EC; --edge:inset 0 1px 0 #fff; --soft:0 1px 2px rgba(36,25,43,.04),0 10px 28px -14px rgba(36,25,43,.18) }
body{background:radial-gradient(1100px 520px at 50% -180px,rgba(184,74,104,.16),transparent 70%) no-repeat,var(--bg)}
:root[data-theme="light"] body{background:radial-gradient(1100px 520px at 50% -180px,rgba(200,50,90,.07),transparent 70%) no-repeat,var(--bg)}
.card,.list{border-radius:var(--r-card);border-color:var(--line);box-shadow:var(--edge),var(--soft)}
.row{padding:12px 16px;border-top-color:var(--line)}
.row .nm b{letter-spacing:-.005em}
.row.on{background:linear-gradient(270deg,var(--acc-soft),transparent 85%)}
.cat h2{font-size:14.5px;letter-spacing:.01em;margin-bottom:10px}
.btn{border-radius:var(--r-tile);background:linear-gradient(180deg,#F7AEC2,var(--acc));box-shadow:0 8px 20px -8px rgba(244,154,178,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
:root[data-theme="light"] .btn{background:linear-gradient(180deg,#D94A70,var(--acc));box-shadow:0 8px 18px -8px rgba(200,50,90,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:scale(.97);box-shadow:0 3px 10px -6px rgba(244,154,178,.5)}
.btn.ghost{background:var(--raise);box-shadow:var(--edge)}
.btn.okb{background:linear-gradient(180deg,#9BE5BE,var(--ok));box-shadow:0 8px 20px -8px rgba(130,217,172,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.step button{transition:transform .1s;box-shadow:var(--edge)}
.step button:last-child{background:linear-gradient(180deg,#F7AEC2,var(--acc));box-shadow:0 6px 14px -6px rgba(244,154,178,.6),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-theme="light"] .step button:last-child{background:linear-gradient(180deg,#D94A70,var(--acc))}
.step button:active{transform:scale(.86)}
.chip{border-color:var(--line);box-shadow:var(--edge)}
.seg{box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
:root[data-theme="light"] .seg{box-shadow:inset 0 1px 2px rgba(36,25,43,.06)}
.seg button[aria-pressed="true"]{box-shadow:0 2px 8px rgba(0,0,0,.25),var(--edge)}
.tabbar{background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top-color:var(--line)}
.tab svg{transition:background .2s}
.sheet{border-radius:28px 28px 0 0;border-top-color:var(--line);box-shadow:0 -20px 60px -20px rgba(0,0,0,.6),var(--edge)}
.kpi{border-radius:var(--r-tile)}
.kpi b{letter-spacing:-.01em}
.banner{border-radius:var(--r-tile);box-shadow:var(--edge)}
.mk{border-radius:var(--r-tile);box-shadow:var(--edge);background:linear-gradient(180deg,var(--raise),color-mix(in srgb,var(--raise) 60%,var(--paper)))}
.ta,.field input,.field select{border-color:var(--line);transition:border-color .15s,box-shadow .15s}
.ta:focus,.field input:focus{box-shadow:0 0 0 4px var(--acc-soft)}
@media (prefers-reduced-motion:reduce){.btn,.step button{transition:none}.btn:active,.step button:active{transform:none}}

/* טבעת קטגוריות (רכש לפי סוג) */
.ring{display:grid;gap:14px;justify-items:center;margin-top:16px}
.ring svg{width:150px;height:150px;display:block}
.ring .rc{font-family:var(--disp);font-size:15px;fill:var(--ink)}
.ring .rl{font-size:10.5px;fill:var(--mute)}
.rlist{display:grid;gap:0;width:100%}
.rli{display:grid;grid-template-columns:10px 1fr auto 46px;gap:10px;align-items:center;font-size:14.5px;padding:9px 2px;border-bottom:1px solid var(--line);white-space:nowrap}
.rli:last-child{border-bottom:0}
.rli i{width:9px;height:9px;border-radius:50%}
.rli span{color:var(--mute);font-size:12.5px;margin-inline-start:6px}
.rli b{font-family:var(--ui);font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rli em{font-style:normal;color:var(--mute);font-size:12px;min-width:38px;text-align:left;font-variant-numeric:tabular-nums}
.cbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cbar .mrow{margin:0;box-shadow:var(--edge)}
.cbar .mrow span{font-size:14px}
.mrow.wide{width:100%;margin:10px 0 0}
.ta.wide{width:100%;margin-bottom:8px}
.crlist{display:grid;gap:8px;margin:8px 0}
.cr{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:14px;padding:11px 12px;box-shadow:var(--edge)}
.cr>div{flex:1;min-width:0}
.cr b{display:block;font-size:15px}
.cr small{color:var(--mute);font-size:12.5px}
.crs{margin-top:4px}
.btable div.over{background:var(--bad-soft)!important}
.btable div.over small{color:var(--bad);font-weight:700}
.btable small{color:var(--mute);font-size:12px}
.btable .agr{border:0;background:none;cursor:pointer;font-size:14px;padding:0 0 0 4px;opacity:.7}
.stdrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stdrow img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.stdrow label{flex:1;text-align:center;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.tcard{border:1px solid var(--line);background:var(--raise);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-align:start;box-shadow:var(--edge)}
.tcard img,.tcard .tph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tcard .tph{display:grid;place-items:center;font-size:30px;background:var(--paper)}
.tcard b{display:block;padding:9px 11px;font-size:14.5px}
.btn.wide{display:block;width:100%;text-align:center;text-decoration:none;margin-top:12px}
.ctags.wdays{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.ctags.wdays .chip.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.wdrow{width:100%;margin-top:12px}
.wdrow b{color:var(--mute);font-weight:600}
.ctl h3{margin:0 0 4px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow>span{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.pchips{display:flex;gap:5px;flex:0 0 auto}

/* נתונים: מדדים, פחת, מקטעים מתקפלים */
.kpis.k4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpis.k4 .kpi b{font-size:34px;line-height:1.05}
.kpis.k4 .kpi b em{font-style:normal;font-size:.5em;color:var(--mute);margin-inline-start:2px}
.kpis.k4 .kpi.hi b{color:var(--warn)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h3{margin:0}
.sech small{color:var(--mute);font-size:12.5px}
.wrow{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl small{color:var(--mute);font-size:12px}
.wbar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:99px;background:var(--mute)}
.wbar i.hi{background:var(--warn)}
.wp{font-family:var(--disp);font-size:17px;text-align:left;color:var(--mute)}
.wp.hi{color:var(--warn)}
.dsec{margin-bottom:10px;overflow:hidden}
.dsh{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;border:0;background:none;color:var(--ink);font:inherit;text-align:start;padding:15px 16px;cursor:pointer}
.dsh b{font-size:15.5px}
.dsh small{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsh .chev{color:var(--mute)}
.dsb{border-top:1px solid var(--line)}
.dsb .card{box-shadow:none;border:0;border-radius:0;margin:0}
.dsb .pad{padding:14px 16px}

/* =====================================================================
   רוזי 2.0 — שכבת עיצוב בסגנון iOS. אותו מבנה ואותם כפתורים, מראה חדש.
   ===================================================================== */
:root{
  --bg:#000; --paper:#1C1C1E; --raise:#2C2C2E; --raise2:#3A3A3C; --line:rgba(84,84,88,.55); --ink:#fff; --mute:rgba(235,235,245,.6); --mute2:rgba(235,235,245,.3);
  --acc:#FF6F91; --acc-ink:#FF8FAB; --acc-soft:rgba(255,111,145,.16); --on-acc:#fff;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.15); --on-ok:#fff; --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.15); --bad:#FF453A; --bad-soft:rgba(255,69,58,.15); --info:#0A84FF; --info-soft:rgba(10,132,255,.15);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Assistant","Rubik",system-ui,sans-serif; --disp:var(--ui);
  --edge:none; --soft:none; --shadow:none; --r-card:12px; --r-tile:12px;
  --spring:cubic-bezier(.32,.72,0,1);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --paper:#fff; --raise:#E9E9EE; --raise2:#D1D1D6; --line:rgba(60,60,67,.22); --ink:#000; --mute:rgba(60,60,67,.6); --mute2:rgba(60,60,67,.3);
  --acc:#E0436A; --acc-ink:#C8325A; --acc-soft:rgba(224,67,106,.11); --ok:#28A745; --ok-soft:rgba(40,167,69,.12); --warn:#E08600; --warn-soft:rgba(224,134,0,.12); --bad:#E5342A; --bad-soft:rgba(229,52,42,.1); --info:#007AFF;
}
html{scroll-behavior:smooth}
body,:root[data-theme="light"] body{background:var(--bg);font-family:var(--ui);font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.glow{position:fixed;top:-140px;left:0;right:0;height:380px;pointer-events:none;z-index:0;background:radial-gradient(55% 55% at 72% 42%,rgba(255,111,145,.20),transparent 72%),radial-gradient(38% 40% at 18% 30%,rgba(255,159,10,.06),transparent 70%);transition:opacity .6s}
.glow.g{background:radial-gradient(55% 55% at 72% 42%,rgba(48,209,88,.20),transparent 72%)}
.glow.n{background:radial-gradient(55% 55% at 72% 42%,rgba(10,132,255,.10),transparent 72%)}
:root[data-theme="light"] .glow{opacity:.55}
header{background:transparent;border-bottom:0;position:sticky;z-index:5}
header::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);opacity:0;transition:opacity .25s;border-bottom:.5px solid var(--line);pointer-events:none}
body.scrolled header::before{opacity:1}
header .wrap{position:relative}
main,header{position:relative;z-index:1}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;padding-top:4px}
.navbar>:first-child{justify-self:start}.navbar>:last-child{justify-self:end}
.navtitle{font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s var(--spring)}
body.scrolled .navtitle{opacity:1;transform:none}
.navback{border:0;background:none;color:var(--acc);font:inherit;font-size:17px;padding:8px 0;cursor:pointer}
.burger{width:36px;height:36px;border-radius:50%;border:0;background:rgba(118,118,128,.24);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.burger:active{transform:scale(.9)}
.burger svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.lt{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:2px 0 0;line-height:1.15;transition:opacity .2s}
.lsub{margin:2px 0 12px;color:var(--mute);font-size:15px}
body.scrolled .lt{opacity:.0}
.days{gap:8px;padding-block:2px 12px}
.day{border:0;background:var(--paper);border-radius:14px;min-width:60px;height:58px;padding:0 12px;display:grid;align-content:center;transition:transform .15s,background .2s}
.day:active{transform:scale(.95)}
.day b{font-size:15px;font-weight:600}.day span{font-size:12px}
.day[aria-pressed="true"]{background:var(--acc);color:#fff}
.jump{gap:8px}
.jump button{border:0;background:var(--paper);border-radius:999px;font-weight:600;font-size:14px;padding:7px 12px}
main.enter{animation:pgin .38s var(--spring)}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* קבוצות ושורות */
.card,.list{border:0;border-radius:12px;box-shadow:none;background:var(--paper)}
.list{overflow:hidden}
.row{border-top:0;position:relative;padding:8px 16px;min-height:56px}
.row+.row::before,.rrow+.rrow::before{content:"";position:absolute;top:0;right:16px;left:0;height:.5px;background:var(--line)}
.row .nm b{font-size:17px;font-weight:400;letter-spacing:-.01em}
.row.on{background:transparent;box-shadow:none}
.row.on .nm b{font-weight:600}
.row.on::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--acc)}
.cat h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 16px 7px;letter-spacing:0}
.cat h2 .ct{color:var(--mute);font-weight:500}
.cat h2 svg,.cat h2 .ci{display:none}
/* סטפר בסגנון iOS */
.step{background:var(--raise);border-radius:9px;gap:0;height:34px;overflow:hidden}
.step button,.step button:last-child{width:42px;height:34px;border-radius:0;background:transparent;color:var(--ink);box-shadow:none;font-size:22px;font-weight:300}
.step button:last-child{color:var(--acc);font-weight:500}
.step button:active{background:var(--raise2);transform:none}
.step output{min-width:30px;font-family:var(--ui);font-size:17px;font-weight:600;position:relative}
.step output::before,.step output::after{content:"";position:absolute;top:8px;bottom:8px;width:.5px;background:var(--line)}
.step output::before{right:0}.step output::after{left:0}
.row:not(.on) .step output{opacity:.45}
.step.lg{background:transparent;height:auto;gap:22px}
.step.lg button{width:56px;height:56px;border-radius:50%;background:var(--raise)}
.step.lg button:last-child{background:var(--acc);color:#fff}
.step.lg output{font-size:40px;font-weight:700}
.step.lg output::before,.step.lg output::after{display:none}
output.bump{animation:bump .32s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
/* כפתורים */
.btn,:root[data-theme="light"] .btn{background:var(--acc);color:#fff;box-shadow:none;border-radius:14px;font-weight:600;font-size:17px;padding:14px 20px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.ghost{background:var(--raise);color:var(--ink);box-shadow:none}
.btn.okb{background:var(--ok);color:#fff;box-shadow:none}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}
.chip{border:0;background:var(--paper);box-shadow:none;font-weight:600}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.seg{background:rgba(118,118,128,.24);border-radius:9px;padding:2px;box-shadow:none}
.seg button{border-radius:7px;font-size:13px;font-weight:600;color:var(--ink);padding:6px 12px}
.seg button[aria-pressed="true"]{background:#636366;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
:root[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff;color:#000}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;margin-bottom:18px}
.seg.mini button{padding:5px 9px;font-size:12.5px}
/* סרגל שליחה */
.barin{background:var(--acc);border:0;border-radius:16px;box-shadow:0 12px 30px -10px rgba(255,111,145,.55);color:#fff;padding:8px 8px 8px 16px}
.bar .sum b{font-family:var(--ui);font-weight:700;font-size:22px}
.bar .sum small{color:rgba(255,255,255,.8)}
.bar .sum small.shw{color:#fff;font-weight:700}
.barin .btn{background:#fff;color:var(--acc);font-weight:700}
.barin .btn:disabled{opacity:.5}
/* לשוניות */
.tabbar{background:color-mix(in srgb,var(--paper) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--line)}
.tab{color:#8E8E93;font-size:10.5px;font-weight:500}
.tab svg{background:none!important;padding:2px 0!important;width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--acc)}
/* גיליונות */
.scrim{background:rgba(0,0,0,.45);animation:fade .25s}
.sheet{background:var(--paper);border:0;border-radius:16px 16px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:shup .42s var(--spring)}
@keyframes shup{from{transform:translateY(100%)}to{transform:none}}
.sheet::before{width:36px;height:5px;background:var(--raise2);margin:-10px auto 14px}
.sheet h3,.sht{font-size:17px;font-weight:600;text-align:center;margin:0 0 14px}
.sheet .big{font-family:var(--ui);font-weight:700;font-size:22px;color:var(--ink);text-align:center}
.sheet .grp{margin:0 0 14px}
.sbtns.one{grid-template-columns:1fr}
.mitem{background:var(--raise);border-radius:12px}
/* קבוצות בסגנון הגדרות */
.gh{font-size:13px;font-weight:500;color:var(--mute);margin:22px 16px 7px}
.grp{background:var(--paper);border-radius:12px;overflow:hidden;margin-bottom:22px}
.gh+.grp{margin-top:0}
.gfoot{font-size:13px;color:var(--mute);margin:-14px 16px 22px;line-height:1.4}
.srow{width:100%;display:flex;align-items:center;gap:12px;min-height:46px;padding:7px 16px;border:0;background:none;color:var(--ink);font:inherit;text-align:start;position:relative;cursor:default}
button.srow{cursor:pointer;transition:background .15s}
button.srow:active{background:var(--raise)}
.srow+.srow::before{content:"";position:absolute;top:0;right:16px;left:0;height:.5px;background:var(--line)}
.srow:has(.ib)+.srow:has(.ib)::before{right:58px}
.srow.center{justify-content:center}
.srow.tall{align-items:flex-start;padding-block:12px}
.st{flex:1;min-width:0}
.st b{display:block;font-size:17px;font-weight:400}
.st b em{font-style:normal;font-weight:600}
.st b.danger,b.danger{color:var(--bad);font-weight:400}
.st small{display:block;font-size:13px;color:var(--mute);margin-top:1px;line-height:1.35}
.sv{color:var(--mute);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sv.tm{font-size:13px}
.sv.warnc{color:var(--warn);font-weight:600}
.schev{color:var(--mute2);font-size:22px;font-weight:300;line-height:1}
.ib{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.ib svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{width:51px;height:31px;border-radius:16px;background:var(--raise2);position:relative;flex:0 0 auto;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:right .28s var(--spring)}
.sw.on{background:var(--ok)}.sw.on::after{right:22px}
.tlink{border:0;background:none;color:var(--acc);font:inherit;font-size:15px;cursor:pointer;padding:6px 0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;display:inline-block;color:var(--ink);font-size:15px}
.prof{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:12px;padding:16px;margin:4px 0 22px}
.pav{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#FF9AB4,#E0436A);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:700;flex:0 0 auto}
.prof b{display:block;font-size:20px;font-weight:700}.prof small{color:var(--mute);font-size:15px}
.about{text-align:center;padding:16px 0 18px}
.alogo{width:96px;height:96px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(160deg,#2A1420,#120A10);display:grid;place-items:center;padding:16px;box-shadow:0 20px 50px -18px rgba(255,111,145,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.about h2{font-size:28px;font-weight:800;margin:0}.about p{color:var(--mute);margin:4px 0 0;font-size:15px}
.copyr{text-align:center;color:var(--mute);font-size:13px}
.gnum{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;margin-top:1px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:0 0 auto}
.srow.ev .st b{font-size:15px}
.fgrp{background:var(--raise);border-radius:12px;overflow:hidden}
.fin{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:13px 16px}
.fin+.fin{border-top:.5px solid var(--line)}

   ===================================================================== */
/* אנדרואיד: אותו פונט ואותה תחושה כמו באייפון */
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Assistant","Roboto","Rubik",system-ui,sans-serif}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font-family:var(--ui)}
/* רקע נקי: הזוהר הצבעוני למעלה עדין בהרבה */
.glow{opacity:.45}:root[data-theme="light"] .glow{opacity:.25}
/* כפתורי + ו-− גדולים יותר: לחיצה בטוחה גם עם כפפות וידיים רטובות */
.step{height:40px;border-radius:10px}
.step button,.step button:last-child{width:46px;height:40px;font-size:24px}
.step output{min-width:34px;font-size:18px}
/* הכנה שכבר בהזמנה: רקע עדין בצבע המסעדה */
.row.on{background:color-mix(in srgb,var(--acc) 7%,transparent)}
/* מספרים מיושרים בכל מקום */
.qty,.kp b,.sk b,.sm b,.tile b,.hq,.day span{font-variant-numeric:tabular-nums}
/* טעינה: שלד אפור במקום "טוען…" */
.skel{display:grid;gap:10px;padding:6px 0}
.skel i{display:block;height:56px;border-radius:12px;background:var(--paper);position:relative;overflow:hidden}
.skel i:nth-child(1){height:72px}.skel i:nth-child(4){width:70%}
.skel i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 5%,transparent),transparent);transform:translateX(100%);animation:skel 1.3s ease-in-out infinite}
@keyframes skel{to{transform:translateX(-100%)}}
/* גרף: עמודות מעוגלות, קו ממוצע מקווקו, בלי רשת */
.chart .avg{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart .grid{display:none}
/* הצעה לשיפור */
.ta.idea{width:100%;min-height:110px;resize:vertical;margin:6px 0 14px;line-height:1.45}
.ta.idea::placeholder{color:var(--mute2,rgba(235,235,245,.3))}
/* mizo: סימן שקט */
.mz{margin:2px 0 0;text-align:center;font-size:10px;letter-spacing:.25em;color:var(--mute);opacity:.35;text-transform:lowercase}
/* תנועה: קצרה ועדינה. מי שביקש פחות תנועה בטלפון — בלי תנועה בכלל */
main.enter{animation-duration:.24s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* לחיצה: משוב מיידי, בלי השהיה של 300ms באנדרואיד */
button,a,label,.row,.srow{touch-action:manipulation}
/* כפתור השליחה כשהוא לא לחיץ: מצב ברור וקריא, לא דהוי */
.barin .btn:disabled,:root[data-theme] .barin .btn:disabled,:root[data-site] .barin .btn:not(.ghost):not(.okb):not(.badb):disabled{opacity:1;background:rgba(255,255,255,.2)!important;color:#fff!important}
/* אנגלית (משמאל לימין): אותו עיצוב במראה הפוך. עברית וערבית לא משתנות */
[dir="ltr"] .tl li::before{right:auto;left:6px}
[dir="ltr"] .row+.row::before,[dir="ltr"] .rrow+.rrow::before,[dir="ltr"] .srow+.srow::before{right:0;left:16px}
[dir="ltr"] .srow:has(.ib)+.srow:has(.ib)::before{right:0;left:58px}
[dir="ltr"] .row.on::after{right:auto;left:6px}
[dir="ltr"] .sw::after{right:auto;left:2px;transition:left .28s var(--spring)}
[dir="ltr"] .sw.on::after{right:auto;left:22px}
[dir="ltr"] .schev,[dir="ltr"] .chev-l{display:inline-block;transform:scaleX(-1)}
[data-lang="en"] .kp small,[data-lang="en"] .sk span,[data-lang="en"] .tile small,[data-lang="en"] .gh,[data-lang="en"] .cath > span:first-child{text-transform:capitalize}
/* ערבית: פונט המערכת של ערבית בכל טלפון */
[data-lang="ar"]{--ui:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic","Assistant",system-ui,sans-serif}

/* הזמנה ליום שהוא לא המשלוח הקרוב → לשאול לפני שליחה */

  if (t.id === "fileZ") { const f = t.files && t.files[0]; t.value = ""; if (f) saveZ(f); return; }
  if (S.sheet && S.sheet.type === "photo" && t.dataset.pf) S.sheet.f[t.dataset.pf] = t.value;
  if (S.re && t.dataset.re) S.re.r[t.dataset.re] = t.value;
  if (S.sheet && S.sheet.type === "dish") { if (t.dataset.ci != null && t.dataset.cf) S.sheet.d.comps[+t.dataset.ci][t.dataset.cf] = t.value; if (t.dataset.dk) S.sheet.d[t.dataset.dk] = t.value; }
  if (t.dataset.days) { const d = parseInt(t.value, 10); if (d > 0) catWrite(t.dataset.days, { d }); }
  else if (t.dataset.role) setRole(t.dataset.role, t.value);
  else if (t.dataset.acsite && S.sheet && S.sheet.type === "access") S.sheet.f.sites[t.dataset.acsite] = t.value;
  else if (t.id === "wk" && S.sheet) { S.sheet.k = t.value; }
});
/* לחיצה ארוכה על לשונית ״פריטים״ ← כרטיסיות מנה (מנהל בלבד) */
const tabLP = { t: null, fired: 0 };
app.addEventListener("pointerdown", (e) => {
  const b = e.target.closest('[data-tab="items"]'); if (!b || true) return;
  tabLP.fired = 0; clearTimeout(tabLP.t);
  tabLP.t = setTimeout(() => { tabLP.fired = Date.now(); if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} S.tab = "dishes"; render(); jumpTo(0); }, 600);
});
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => app.addEventListener(ev, () => clearTimeout(tabLP.t)));
app.addEventListener("contextmenu", (e) => { if (e.target.closest('[data-tab="items"]')) e.preventDefault(); });
/* לחיצה ארוכה על הכנה בהזמנה ← הערה לאותה הכנה */
let lp = null;
app.addEventListener("pointerdown", (e) => {
  if (!can.order() || S.tab !== "order" || e.target.closest("button")) return;
  const row = e.target.closest(".row[data-k]"); if (!row) return;
  const x = e.clientX, y = e.clientY;
  lp = { x, y, t: setTimeout(() => { lp = null; if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} S.sheet = { type: "inote", k: row.dataset.k }; render(); const i = $("inoteIn"); if (i) i.focus(); }, 550) };
});
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => app.addEventListener(ev, () => { if (lp) { clearTimeout(lp.t); lp = null; } }));
app.addEventListener("pointermove", (e) => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.t); lp = null; } });
window.addEventListener("scroll", () => { if (lp) { clearTimeout(lp.t); lp = null; } }, { passive: true });
app.addEventListener("contextmenu", (e) => { if (e.target.closest(".row[data-k]") && S.tab === "order") e.preventDefault(); });
function chartTip(e) { const g = e.target.closest && e.target.closest(".b"); if (!g) return; const box = g.closest(".chartbox"); box.querySelector(".ctip").textContent = g.dataset.tip; box.querySelectorAll(".b.on").forEach((x) => x.classList.remove("on")); g.classList.add("on"); }
app.addEventListener("pointerover", chartTip);
app.addEventListener("pointerdown", chartTip);
/* כותרת גדולה שמתכווצת בגלילה, כמו באייפון */
/* גלילה: כותרת גדולה שמתכווצת לסרגל העליון (רק opacity/transform, פעם בפריים) */
function onScroll() { scrT = 0; const y = Math.max(0, window.scrollY), p = Math.min(1, y / 56); document.documentElement.style.setProperty("--sp", p.toFixed(3)); document.body.classList.toggle("scrolled", y > 40); }
window.addEventListener("scroll", () => { if (!scrT) scrT = requestAnimationFrame(onScroll); }, { passive: true });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } else if (e.key === "Enter" && e.target.id === "wG") { e.preventDefault(); addWeighing(); } });
setInterval(() => { remindTick(); const a = document.activeElement; if (S.user && !S.sheet && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"))) render(); }, 30000);
window.addEventListener("online", () => render());
window.addEventListener("offline", () => render());
window.addEventListener("beforeunload", () => { if (Object.keys(pending).length) flush(); runAutoNow(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { flush(); runAutoNow(); } else if (S.tab === "dishes" && S.lab === "book" && S.rv && !S.re) keepAwake(true); });
render();

</script>
