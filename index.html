<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="רוזי">
<title>הזמנות רוזי</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Rosie — bright, calm kitchen tool. White cards on warm paper, one rose accent. */
:root{
  --bg:#F7F6F3; --paper:#FFFFFF; --ink:#22201E; --mute:#7A756F; --line:#ECE9E4; --soft:#F3F1ED; --hover:#EEEBE6;
  --acc:#D9435E; --acc-ink:#B8304A; --acc-soft:#FDEEF1;
  --ok:#23885A; --ok-soft:#E7F5EE; --warn:#B26B0A; --warn-soft:#FDF3E1; --bad:#C2392E; --bad-soft:#FCEBE9; --info:#2F6FB3; --info-soft:#EAF2FB;
  --shadow:0 1px 2px rgba(34,32,30,.04),0 6px 20px rgba(34,32,30,.05);
  --r:16px; --ui:"Rubik","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141312; --paper:#1D1C1A; --ink:#F2EFEB; --mute:#A49E97; --line:#2C2A27; --soft:#262421; --hover:#2E2B28;
  --acc:#F06A82; --acc-ink:#F48A9C; --acc-soft:#3A1F26;
  --ok:#5CCB95; --ok-soft:#183126; --warn:#E9AE57; --warn-soft:#382B15; --bad:#F2877C; --bad-soft:#3A1E1B; --info:#7EB0EA; --info-soft:#1A2838;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body.locked{overflow:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{display:grid;place-items:center;min-height:85vh}

/* logo + avatar */
.logo{width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;margin:0 auto 14px}
.logo.sm{width:30px;height:30px;border-radius:10px;font-size:16px;margin:0}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;font-size:14px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.avatar.sm{width:34px;height:34px;font-size:13px}
.avatar.lg{width:48px;height:48px;font-size:17px}

/* login */
.auth{min-height:92vh;display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.authcard{width:100%;max-width:380px;padding:30px 24px 22px;text-align:center}
.authcard h1{font-size:26px;margin:0;font-weight:700}
.authcard .sub{margin:4px 0 22px;color:var(--mute);font-size:14px}
.authcard .field{text-align:right}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select,.notebox textarea{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px}
.field input:focus,.notebox textarea:focus,.search:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0 0 8px}
.link{background:none;border:0;color:var(--acc-ink);font:inherit;font-weight:600;cursor:pointer;padding:0}
.center{text-align:center;margin-top:16px;font-size:14px;color:var(--mute)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;position:relative;background:none;border:0;border-radius:10px;padding:9px 10px;font-weight:500;font-size:14.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--acc);color:#fff;font-size:11.5px;font-style:normal;font-weight:700;vertical-align:1px}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:10px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 auto;border:0;background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;min-width:64px;text-align:center;cursor:pointer;box-shadow:0 0 0 1px var(--line) inset}
.day b{display:block;font-size:13.5px;font-weight:600}
.day span{display:block;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.day[aria-pressed="true"] span{color:inherit;opacity:.7}
.dot{position:absolute;top:5px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--paper)}
main{padding-block:6px 120px}

/* status + banners */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;margin-bottom:12px}
.when b{display:block;font-size:16px;font-weight:600}
.when small{color:var(--mute);font-size:12.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--mute)}
.pill.open,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad);white-space:normal}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:right;font:inherit;color:var(--ink);background:var(--paper);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);flex-wrap:wrap}
.banner > svg{flex:0 0 auto}
.banner > span:first-of-type{flex:1;min-width:180px;font-size:14px}
.banner i{font-style:normal;font-weight:600;color:var(--warn);font-size:13.5px}
.banner.warn{background:var(--warn-soft)} .banner.warn > svg{color:var(--warn)}
button.banner{cursor:pointer}
.banner.ok > svg{color:var(--ok)} .banner.ok.solid{background:var(--ok-soft)}
.banner.info{background:var(--info-soft)} .banner.info > svg{color:var(--info)}
.banner.sugg{background:var(--acc-soft)} .banner.sugg > svg{color:var(--acc)}
.bbtns{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.x{border:0;background:none;color:var(--mute);font-size:15px;width:34px;height:34px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.x:hover{background:var(--hover)}

/* tools */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools.end{justify-content:center;margin-top:18px}
.search{flex:1 1 90px;min-width:0;border:1.5px solid transparent;background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 13px;font:inherit;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.chip svg{color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] svg{color:inherit}
.notebox{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;display:grid;gap:6px}
.notebox label{font-size:13px;font-weight:600;color:var(--mute)}
.notebox textarea{resize:vertical;min-height:52px}
.seg{display:inline-flex;gap:3px;background:var(--soft);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:8px 13px;font-size:14px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* lists */
section.cat{margin-bottom:18px}
.cat h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 4px 7px;display:flex;justify-content:space-between}
.cat h2 .ct{font-weight:500;color:var(--acc-ink)}
.list{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:60px;transition:background .15s}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:500;display:block;font-size:15.5px}
.row .nm small{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.row.on{background:linear-gradient(to left,var(--acc-soft),transparent 70%);box-shadow:inset -3px 0 0 var(--acc)}
.row.off{opacity:.45}
.okt{display:block;color:var(--ok)!important}
.step{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.step button{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button:last-child{background:var(--acc-soft);color:var(--acc-ink)}
.step button:active{transform:scale(.94)}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:34px;text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.row:not(.on) .step output{color:var(--mute);font-weight:400}
.step.sm button{width:34px;height:34px;font-size:18px}
.step.lg{justify-content:center;gap:14px}
.step.lg button{width:52px;height:52px;font-size:26px}
.step.lg output{font-size:28px;min-width:60px}
output.chg{color:var(--acc-ink)!important;font-weight:700!important}
.check{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--paper);cursor:pointer;flex:0 0 auto;position:relative}
.check::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);font-size:20px;opacity:0;transition:opacity .15s}
.check:hover::after,.check:focus-visible::after{opacity:.5}
.check:disabled{cursor:default}
.qty{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.qty small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.ahead{color:var(--info)}
.tag{font-style:normal;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;display:inline-block;margin-top:2px}
.tag.new{background:var(--info-soft);color:var(--info)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.tag.down{background:var(--soft);color:var(--mute)}
.num{width:62px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 4px;text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums}
.sel{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 8px;font:inherit}
.sel.full{width:100%;padding:12px;font-size:16px}

/* production */
.progress-card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;margin-bottom:12px;font-size:14px}
.progress-card b{font-size:16px}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.hint{font-size:12.5px;color:var(--mute);margin:0 4px 10px}
.donebar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:14px;border-radius:var(--r);padding:12px 16px;cursor:pointer;margin-top:4px}
.donelist{margin-top:8px}
.drow{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:right;color:var(--ink);cursor:pointer;font:inherit}
.drow:first-child{border-top:0}
.drow .nm b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.tick{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.done-all{border-style:solid;background:var(--ok-soft);color:var(--ok)}
.done-all b{color:var(--ok)!important}

/* approval */
.approve{background:var(--paper);border-radius:var(--r);box-shadow:0 0 0 2px var(--warn) inset,var(--shadow);padding:14px;margin-bottom:14px}
.atop b{display:block;font-size:16.5px;font-weight:600}
.atop small{color:var(--mute);font-size:13px}
.anote{display:flex;gap:8px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-radius:12px;padding:9px 12px;margin:10px 0 0;font-size:14px}
.anote svg{color:var(--info);flex:0 0 auto;margin-top:2px}
.ahint{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.alist{margin-top:8px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-weight:500;display:block}
.arow .nm small{color:var(--mute);font-size:12.5px}
.abtns,.sbtns{display:flex;gap:8px;margin-top:14px}
.abtns .btn,.sbtns .btn{flex:1}

/* buttons */
.btn{border:0;border-radius:13px;padding:13px 20px;font-size:15.5px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* bottom bar */
.bar{position:fixed;inset:auto 0 0;z-index:6;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.barin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:20px;padding:10px 10px 10px 16px;padding-inline-start:18px;box-shadow:0 8px 30px rgba(34,32,30,.14),0 0 0 1px var(--line);pointer-events:auto}
.bar .sum{flex:1;min-width:0;font-size:14px}
.bar .sum b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .sum small{display:block;color:var(--mute);font-size:12.5px;margin-top:-2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.38);z-index:20;animation:fade .15s}
.sheet{position:fixed;inset:auto 0 0;z-index:21;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;max-width:560px;margin:0 auto;animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:600}
.sheet .big{font-size:21px;font-weight:600;margin:4px 0 16px;color:var(--acc-ink)}
.sheet .hint{margin:8px 0 0;text-align:center}
.sheet .field{margin-top:12px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.me b{display:block;font-size:17px}
.me small{color:var(--mute)}
.mitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);color:var(--ink);border-radius:13px;padding:14px;font-size:15px;cursor:pointer;margin-top:8px;text-align:right}
.steps{padding-inline-start:20px;line-height:1.8}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* data */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpis .kpi:last-child{grid-column:1/-1}
@media (min-width:640px){.kpis{grid-template-columns:repeat(5,1fr)}.kpis .kpi:last-child{grid-column:auto}}
.kpi{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.kpi small{display:block;color:var(--mute);font-size:12.5px}
.kpi b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi span{color:var(--mute);font-size:12px}
section.card{margin-bottom:14px;overflow:hidden}
.pad{padding:14px 15px}
.pad-x{padding-inline:15px}
section.card h3{font-size:15px;font-weight:600;margin:0 0 8px}
section.card > h3.pad-x{padding-top:14px}
.chartbox{position:relative}
.ctip{font-size:13px;color:var(--mute);min-height:20px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:150px;display:block}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}
.chart .bar{fill:var(--acc);opacity:.8;transition:opacity .15s}
.chart .hit{fill:transparent}
.chart .b{cursor:pointer}
.chart .b:hover .bar,.chart .b.on .bar{opacity:1}
.chart .b.on .bar{fill:var(--acc-ink)}
.clabels{display:flex;flex-direction:row;border-top:1px solid var(--line);padding-top:5px}
.clabels span{flex:1;min-width:0;font-size:11px;color:var(--mute);text-align:center;white-space:nowrap;overflow:visible}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--acc-ink);font-weight:600;padding:13px;cursor:pointer;font-size:14px}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1fr 54px 62px 84px;gap:8px;align-items:center;padding:10px 15px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:right;font:inherit;font-variant-numeric:tabular-nums;cursor:pointer;width:100%}
.tr span:not(:first-child){text-align:center}
.tr b{font-weight:500}
.tr.th{cursor:default;color:var(--mute);font-size:12.5px;font-weight:600;border-top:0;padding-block:6px}
.trx{display:flex;flex-wrap:wrap;gap:6px;padding:4px 15px 12px;background:var(--soft)}
.trx span{background:var(--paper);border-radius:10px;padding:6px 10px;text-align:center;min-width:46px}
.trx span small{display:block;color:var(--mute);font-size:11px}
.trx span.wide{flex-basis:100%;text-align:right;background:none;padding:4px 0 0;color:var(--mute);font-size:12.5px}
.badv{color:var(--bad)}
.hist{display:grid}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 15px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:right;font:inherit;width:100%;cursor:pointer}
.hrow.static{cursor:default}
.hd{flex:1;min-width:120px}
.hd b{display:block;font-weight:500}
.hd small{color:var(--mute);font-size:12.5px}
.hq{font-weight:600;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.hq small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.hp{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%}
.hx{display:flex;flex-wrap:wrap;gap:6px;padding:4px 15px 14px;background:var(--soft)}
.hx span{background:var(--paper);border-radius:9px;padding:5px 10px;font-size:13.5px}
.hx p{flex-basis:100%;margin:6px 0 0}
.ebtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ebtns .btn{flex:1 1 180px}
.vrow{display:flex;gap:8px;margin-top:10px}
.vrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}

/* admin forms */
.form{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:8px;padding:12px;margin-bottom:16px}
.form input,.form select{min-width:0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:10px;font:inherit}
@media (max-width:560px){.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}}

  else if (t.id === "logout") { clearTimeout(flushTimer); S.sheet = null; render(); flush().finally(() => signOut(auth)); }
  else if (t.id === "menu") { S.sheet = { type: "menu" }; render(); }
  else if (t.id === "sClose") { S.sheet = null; render(); }
  else if (t.id === "pushBtn") enablePush();
  else if (d.day) { flush(); S.day = d.day; watchDay(); render(); }
  else if (d.tab) { S.tab = d.tab; if (d.tab === "data" && !S.data) loadData(); render(); window.scrollTo(0, 0); }
  else if (d.goapprove) { flush(); S.tab = "prod"; if (S.day !== d.goapprove) { S.day = d.goapprove; watchDay(); } render(); window.scrollTo(0, 0); }
  else if (d.inc) bump(d.inc, 1);
  else if (d.dec) bump(d.dec, -1);
  else if (d.ainc) { approveDraft[d.ainc] = approvalQty(d.ainc) + 1; render(); }
  else if (d.adec) { approveDraft[d.adec] = Math.max(0, approvalQty(d.adec) - 1); render(); }
  else if (t.id === "approve") approve();
  else if (t.id === "reject") { S.sheet = { type: "reject", change: hasApproved(O()) }; render(); }
  else if (t.id === "sRejectOk") rejectOrder(($("rjnote") || {}).value || "");
  else if (d.done) { S.sheet = { type: "done", k: d.done, made: prodQty(d.done) }; render(); }
  else if (d.smade) { sh.made = Math.max(0, sh.made + +d.smade); render(); }
  else if (t.id === "sDoneOk") confirmDone();
  else if (d.undo) { S.sheet = { type: "undo", k: d.undo }; render(); }
  else if (t.id === "sUndoOk") { setProd(sh.k, { done: false }); S.sheet = null; render(); }
  else if (t.id === "toggleDone") { S.showDone = !S.showDone; render(); }
  else if (t.id === "wasteBtn") { S.sheet = { type: "waste", k: "", qty: 1, reason: REASONS[0] }; render(); }
  else if (d.wq) { sh.qty = Math.max(0.5, sh.qty + +d.wq); render(); }
  else if (d.wr) { sh.reason = d.wr; render(); }
  else if (t.id === "sWasteOk") saveWaste();
  else if (t.id === "recvAll") receiveAll({});
  else if (t.id === "recvMiss") { S.sheet = { type: "missing", missing: {} }; render(); }
  else if (d.minc) { sh.missing[d.minc] = (sh.missing[d.minc] || 0) + 1; render(); }
  else if (d.mdec) { sh.missing[d.mdec] = Math.max(0, (sh.missing[d.mdec] || 0) - 1); render(); }
  else if (t.id === "sMissOk") receiveAll(sh.missing);
  else if (t.id === "useSugg") applySuggestion();
  else if (t.id === "offSugg") { S.suggOff[S.day] = true; render(); }
  else if (t.id === "noteBtn") { S.noteOpen = !S.noteOpen; render(); if (S.noteOpen) { const n = $("note"); if (n) n.focus(); } }
  else if (d.toggle) { const it = items(true).find((x) => x.k === d.toggle); if (it) catWrite(it.k, { active: it.active === false }); }
  else if (t.id === "only") { S.onlyOrdered = !S.onlyOrdered; render(); }
  else if (t.id === "send") sendOrder();
  else if (d.range) { S.range = +d.range; S.histAll = false; loadData(); }
  else if (d.orow) { S.openRow = S.openRow === d.orow ? null : d.orow; render(); }
  else if (d.oday) { S.openDay = S.openDay === d.oday ? null : d.oday; render(); }
  else if (d.delw) { if (confirm("למחוק את רישום הפחת?")) deleteDoc(doc(db, "waste", d.delw)).then(() => { S.data.waste = S.data.waste.filter((w) => w.id !== d.delw); render(); toast("נמחק"); }).catch(() => toast("לא נמחק")); }
  else if (t.id === "histAll") { S.histAll = true; render(); }
  else if (t.id === "expText") copyText();
  else if (t.id === "expOrders") exportCSV("orders");
  else if (t.id === "expWaste") exportCSV("waste");
});
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); }
  else if (t.id === "note") saveNote(t.value);
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.days) { const d = parseInt(t.value, 10); if (d > 0) catWrite(t.dataset.days, { d }); }
  else if (t.dataset.role) setRole(t.dataset.role, t.value);
  else if (t.id === "wk" && S.sheet) { S.sheet.k = t.value; }
});
function chartTip(e) { const g = e.target.closest && e.target.closest(".b"); if (!g) return; const box = g.closest(".chartbox"); box.querySelector(".ctip").textContent = g.dataset.tip; box.querySelectorAll(".b.on").forEach((x) => x.classList.remove("on")); g.classList.add("on"); }
app.addEventListener("pointerover", chartTip);
app.addEventListener("pointerdown", chartTip);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
setInterval(() => { remindTick(); const a = document.activeElement; if (S.user && !S.sheet && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"))) render(); }, 30000);
window.addEventListener("online", () => render());
window.addEventListener("offline", () => render());
window.addEventListener("beforeunload", () => { if (Object.keys(pending).length) flush(); });
render();

</script>
</body>
</html>
