/* Rosie — "rose garden at night". Plum-night surfaces, petal-pink actions, leaf-green for done.
   Display numbers & brand: Secular One. Everything else: Assistant. Dark by default, day mode for bright kitchens. */
/* סולם גופנים סגור: 12 · 13 · 15 · 16 · 17 · 22 · 32 · 34–48. חריגים מכוונים (ונבדקים ככאלה ב-tests/ui/audit.py):
   - ספרות תצוגה בגופן --disp (סכום בסרגל השליחה 28, KPI ומספרי כרטיסים 28–30, מספר בגיליון 26, .cbig 28, .hq/.qty/.ptx 20–22): קטנות מ-34 כדי לא לשבור שורה בטלפון
   - סימני − / + בסטפר (19 / 23 / 28): גליף, לא טקסט
   - הלוגו הכתוב .mzw (30 / 52) וסמל המסך .tcard .tph (30)
   - שברונים: .schev 20 (גליף), .chev 0 (מוסתר, SVG במקומו)
   רדיוסים: 0 · 8 · 12 · 14 · 16 · 32 (ראש גיליון, design2) · 999. חריגים מכוונים: סרגל השליחה .barin 22 (גלולה צפה מעל התוכן, מכוון), .alogo 22 (אייקון אפליקציה)
   ריווח (padding/margin/gap): כפולות של 4 */
:root{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body.locked{overflow:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{display:grid;place-items:center;min-height:85vh}

/* petal logo + avatar */
.logo{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 16px}
.logo.sm{width:38px;height:38px;margin:0}
.rose{width:100%;height:100%;display:block;overflow:visible}
.rose .p1{fill:var(--rose1)}
.rose .p2{fill:var(--rose2)}
.rose .c{fill:var(--rose3)}
.rose .s{fill:none;stroke:var(--rose2);stroke-width:1.4;stroke-linecap:round}
.ci{flex:0 0 auto;color:var(--acc)}
.cat h2 > span:first-child{display:inline-flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:700;font-size:13px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.lg{width:52px;height:52px;font-size:17px;background:var(--acc-soft);color:var(--acc-ink);border:0}

/* login */
.auth{min-height:92vh;display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.authcard{width:100%;max-width:380px;padding:36px 24px 24px;text-align:center}
.authcard h1{font-family:var(--disp);font-weight:400;font-size:32px;margin:0}
.authcard .sub{margin:4px 0 24px;color:var(--mute);font-size:15px}
.authcard .field{text-align:start}
.field{display:grid;gap:8px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select,.notebox textarea,.ta{border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-size:16px}
.field input:focus,.notebox textarea:focus,.ta:focus,.search:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:0 0 8px}
.link{background:none;border:0;color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.center{text-align:center;margin-top:16px;font-size:15px;color:var(--mute)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.1}
.brand small{display:block;color:var(--mute);font-size:13px}
.days{display:flex}
.days::-webkit-scrollbar,.jump::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 auto;color:var(--ink);text-align:center}
.day b{display:block}
.day span{display:block;color:var(--mute);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{border-color:var(--acc)}
.dot{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.jump{display:flex;padding-block:0 12px}
.jump button{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer}
.jump button:active{background:var(--raise)}
.jump i{font-style:normal;min-width:20px;height:20px;padding:0 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}

/* bottom tab bar */
.tabbar{display:flex;padding:8px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;position:relative;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:8px 4px;font-size:12px;cursor:pointer;border-radius:14px}
.tab svg{box-sizing:content-box;border-radius:999px}
.tab[aria-selected="true"] svg{background:var(--acc-soft)}
.badge{padding:0 8px;background:var(--warn);color:#2A1C05;font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid var(--paper)}

/* status card + order journey */
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 6%,var(--paper)),var(--paper) 60%);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px;margin-bottom:12px}
.when b{display:block;font-size:17px;font-weight:800}
.when small{color:var(--mute);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--raise);color:var(--mute)}
.pill.open,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad);white-space:normal}
.track{flex-basis:100%;display:flex;list-style:none;margin:8px 0 0;padding:0}
.track li{flex:1;position:relative;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--mute);text-align:center}
.track li::before{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track i{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.track li.done{color:var(--ok)} .track li.done i{background:var(--ok);border-color:var(--ok)} .track li.done::before{background:var(--ok)}
.track li.now{color:var(--ink);font-weight:700} .track li.now i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.track li.bad{color:var(--bad);font-weight:700} .track li.bad i{background:var(--bad);border-color:var(--bad)}
.track li.warn{color:var(--warn)} .track li.warn i{background:var(--warn);border-color:var(--warn)}
.track li small{display:block;font-size:12px;font-weight:700;color:var(--warn)}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;color:var(--ink);padding:12px 16px;margin-bottom:12px}
.banner > svg{flex:0 0 auto}
.banner > span:first-of-type{flex:1;min-width:180px;font-size:15px}
.banner i{font-style:normal;font-weight:700;color:var(--warn);font-size:13px}
.banner.warn > svg{color:var(--warn)}
button.banner{cursor:pointer}
.banner.ok > svg{color:var(--ok)} 
.banner.info{background:var(--info-soft)} .banner.info > svg{color:var(--info)}
.banner.sugg{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent)} .banner.sugg > svg{color:var(--acc)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .banner.bad b{color:var(--bad)}
.bbtns{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.x{border:0;background:none;color:var(--mute);font-size:16px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.x:hover{background:var(--raise)}

/* tools */
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tools.end{justify-content:center;margin-top:20px}
.search{flex:1 1 90px;min-width:0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit}
.search::placeholder,.ta::placeholder,textarea::placeholder,input::placeholder{color:var(--mute);opacity:.8}
.chip{display:inline-flex;align-items:center;gap:8px;color:var(--ink);border-radius:999px;padding:12px 16px;font-size:15px;white-space:nowrap}
.chip svg{color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip[aria-pressed="true"] svg{color:inherit}
.notebox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:16px;display:grid;gap:8px}
.notebox label{font-size:13px;font-weight:700;color:var(--mute)}
.notebox textarea{resize:vertical;min-height:54px}
.ta{resize:vertical}
.seg{display:inline-flex;gap:4px}
.seg button{border:0;background:none;cursor:pointer}

/* lists */
section.cat{scroll-margin-top:200px;margin-bottom:20px}
.cat h2{display:flex;justify-content:space-between;align-items:baseline}
.cat h2 .ct{font-size:13px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;transition:background .15s}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;line-height:1.25}
.row .nm small{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.row.off{opacity:.45}
.okt{display:block;color:var(--ok)!important}
.step{display:flex;align-items:center}
.step button{width:44px;height:44px;border:0;border-radius:50%;background:var(--raise);color:var(--ink);font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button:disabled{opacity:.3;cursor:default;transform:none}
.step output{text-align:center;font-variant-numeric:tabular-nums}
.row:not(.on) .step output{color:var(--mute)}
.step.lg{justify-content:center}
.step.lg button{font-size:28px}
output.chg{color:var(--acc-ink)!important;opacity:1!important}
.check{border-radius:50%;background:transparent}
.check::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);font-size:22px;font-weight:800;opacity:0;transition:opacity .15s}
.check:hover::after,.check:focus-visible::after{opacity:.6}
.check:disabled{cursor:default;opacity:.35}
.qty{font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.qty small{display:block;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--mute)}
.ahead{color:var(--info);font-weight:600}
.tag{font-style:normal;font-size:12px;font-weight:700;border-radius:8px;padding:0 8px;display:inline-block;margin-top:4px}
.tag.new{background:var(--info-soft);color:var(--info)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.tag.down{background:var(--raise);color:var(--mute)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.lack{display:grid;gap:12px;margin-top:16px;padding:16px;border-radius:16px;background:var(--warn-soft)}
.lack b{color:var(--warn);font-size:15px}
.lack small{color:var(--mute);font-size:13px}
.lack .seg{display:flex}.lack .seg button{flex:1}
.num{width:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:8px 4px;text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.sel{border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:8px 12px;font:inherit}
.sel.full{width:100%;padding:12px;font-size:16px}

/* production */
.progress-card{margin-bottom:12px;font-size:15px}
.progress-card b{font-size:20px}
.progress{height:10px;background:var(--raise);border-radius:99px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.hint{font-size:13px;color:var(--mute);margin:0 8px 12px}
.donebar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:15px;border-radius:18px;padding:16px 16px;cursor:pointer;margin-top:4px}
.donelist{margin-top:8px}
.drow{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:start;color:var(--ink);cursor:pointer;font:inherit}
.drow:first-child{border-top:0}
.drow .nm b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--mute)}
.drow.goal .nm b{color:var(--ok)}
.nm small.upd{color:var(--mute)}
.tick{border-radius:50%;color:var(--on-ok);display:grid;place-items:center;font-size:16px;font-weight:800}
.done-all{background:var(--ok-soft)!important;border-color:transparent!important;color:var(--ok)}
.done-all b{color:var(--ok)!important}

/* approval */
.approve{background:var(--paper);border:2px solid var(--warn);padding:16px;margin-bottom:16px}
.atop b{display:block;font-size:17px;font-weight:800}
.atop small{color:var(--mute);font-size:13px}
.anote{display:flex;gap:8px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-radius:14px;padding:12px 12px;margin:12px 0 0;font-size:15px}
.anote svg{color:var(--info);flex:0 0 auto;margin-top:4px}
.ahint{font-size:13px;color:var(--mute);margin:12px 0 0}
.alist{margin-top:8px}
.arow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-weight:700;display:block}
.arow .nm small{color:var(--mute);font-size:13px}
.abtns,.sbtns{display:flex;gap:8px;margin-top:16px}
.abtns .btn,.sbtns .btn{flex:1}

/* buttons */
.btn{border:0;padding:16px 20px;font-size:16px;font-weight:800;color:var(--on-acc);white-space:nowrap}
.btn.full{width:100%}
.btn.big{padding:16px 24px;font-size:17px}
.btn.badb{background:var(--bad);color:#2A0B07}
:root[data-theme="light"] .btn.badb{color:#fff}
.btn.badt,.linkbtn.badt{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* bottom send bar */
.bar{position:fixed;inset:auto 0 0;z-index:6;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
body.has-tabbar .bar{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:12px}
.barin{margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;font-size:15px}
.bar .sum b{line-height:1;font-variant-numeric:tabular-nums}
.bar .sum small{flex-basis:100%;font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20}
.sheet{border-top:1px solid var(--line);margin:0 auto}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800}
.sheet .big{margin:4px 0 20px}
.sheet .hint{margin:12px 0 0;text-align:center}
.sheet .field{margin-top:16px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.me b{display:block;font-size:17px}
.me small{color:var(--mute)}
.mitem{display:flex;align-items:center;gap:12px;border:0;color:var(--ink);font-size:16px;font-weight:600;margin-top:8px;text-align:start}
.steps{padding-inline-start:24px;line-height:1.9}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* data */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}.kpis .kpi:last-child:nth-child(odd){grid-column:auto}}
.kpi small{display:block;color:var(--mute);font-size:13px;font-weight:600}
.kpi b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;margin:4px 0;line-height:1.15}
.kpi span{color:var(--mute);font-size:12px}
section.card{margin-bottom:16px;overflow:hidden}
.pad{padding:16px 16px}
.pad-x{padding-inline:16px}
section.card h3{font-size:16px;font-weight:800;margin:0 0 8px}
section.card > h3.pad-x{padding-top:16px}
.chartbox{position:relative}
.ctip{font-size:13px;color:var(--mute);min-height:20px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:150px;display:block}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}
.chart .bar{fill:var(--acc);opacity:.75;transition:opacity .15s}
.chart .hit{fill:transparent}
.chart .b{cursor:pointer}
.chart .b:hover .bar,.chart .b.on .bar{opacity:1}
.chart .b.on .bar{fill:var(--acc-ink)}
.clabels{display:flex;flex-direction:row;border-top:1px solid var(--line);padding-top:4px}
.clabels span{flex:1;min-width:0;font-size:12px;color:var(--mute);text-align:center;white-space:nowrap;overflow:visible}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--acc-ink);font-weight:700;padding:16px;cursor:pointer;font-size:15px}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1fr 54px 62px 84px;gap:8px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;width:100%}
.tr span:not(:first-child){text-align:center}
.tr b{font-weight:600}
.tr.th{cursor:default;color:var(--mute);font-size:13px;font-weight:700;border-top:0;padding-block:8px}
.trx{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px;background:var(--raise)}
.trx span{background:var(--paper);border-radius:12px;padding:8px 12px;text-align:center;min-width:46px}
.trx span small{display:block;color:var(--mute);font-size:12px}
.trx span.wide{flex-basis:100%;text-align:start;background:none;padding:4px 0 0;color:var(--mute);font-size:13px}
.badv{color:var(--bad)} .warnv{color:var(--warn)} .nw{white-space:nowrap}
.shw{font-style:normal;color:var(--warn);font-weight:700}
.hist{display:grid}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;width:100%;cursor:pointer}
.hrow.static{cursor:default}
.hd{flex:1;min-width:120px}
.hd b{display:block;font-weight:700}
.hd small{color:var(--mute);font-size:13px}
.hq{font-family:var(--disp);font-size:20px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.hq small{display:block;font-family:var(--ui);font-size:12px;color:var(--mute)}
.hp{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%}
.hx{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 16px;background:var(--raise)}
.hx span{background:var(--paper);border-radius:10px;padding:4px 12px;font-size:13px}
.hx p{flex-basis:100%;margin:8px 0 0}
.ebtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ebtns .btn{flex:1 1 180px}
.vrow{display:flex;gap:8px;margin-top:12px}
.vrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 12px;font:inherit;font-size:13px;background:var(--raise);color:var(--ink)}

/* admin forms */
.form{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:8px;padding:12px;margin-bottom:16px}
.form input,.form select{min-width:0;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:12px;padding:12px;font:inherit}
@media (max-width:560px){.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}}
.note{font-size:13px;color:var(--mute);margin:4px 8px 12px}
.empty{text-align:center;color:var(--mute);border-radius:20px;margin-bottom:12px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:800;margin-bottom:4px}
.toast{position:fixed;left:50%;padding:12px 20px;font-size:15px;z-index:30;opacity:0;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tools.end .chip span{display:inline!important}
@media (max-width:420px){.tr{grid-template-columns:1fr 44px 52px 70px;gap:8px;padding-inline:12px}.tools .chip span{display:none}.chip.icon{padding:12px 12px}}
.banner.sugg .bbtns{flex-basis:100%;flex-wrap:wrap;margin:0}
.banner.sugg .bbtns .btn{flex:1 1 140px}

/* intro: service goals */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:12px;background:radial-gradient(120% 80% at 50% 35%,color-mix(in srgb,var(--acc) 14%,var(--bg)),var(--bg) 65%);transition:opacity .45s ease,transform .45s ease;cursor:pointer}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
#intro .in-rose{width:112px;height:112px;animation:spin 1.1s cubic-bezier(.2,.8,.2,1) both}
#intro .rose ellipse,#intro .rose circle{transform-box:fill-box;transform-origin:center;animation:bloom .6s cubic-bezier(.3,1.4,.5,1) both}
#intro .rose .c{animation-delay:.68s}
#intro .rose .s{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .5s .65s ease-out forwards}
#intro .in-word{font-family:var(--disp);font-size:44px;line-height:1;color:var(--ink);animation:rise .5s .55s both}
#intro .in-sub{color:var(--mute);font-size:15px;margin-top:-4px;animation:rise .5s .7s both}
#intro .in-goals{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
#intro .in-goals li{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;color:var(--ink);animation:rise .45s both}
#intro .in-goals li:nth-child(1){animation-delay:1s}#intro .in-goals li:nth-child(2){animation-delay:1.25s}#intro .in-goals li:nth-child(3){animation-delay:1.5s}
#intro .in-goals i{width:26px;height:26px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
@keyframes bloom{from{transform:scale(0);opacity:0}}
@keyframes spin{from{transform:rotate(-40deg) scale(.85)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hrow-act{flex-basis:100%;margin:8px 0 0!important}
section.card.danger{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
section.card.danger h3{color:var(--bad)}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid}
.tl li{display:flex;gap:12px;position:relative;padding:0 0 16px}
.tl li::before{content:"";position:absolute;right:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{flex:0 0 14px;height:14px;border-radius:50%;background:var(--acc);margin-top:4px;position:relative;z-index:1}
.tl li.ok i{background:var(--ok)} .tl li.bad i{background:var(--bad)} .tl li.warn i{background:var(--warn)} .tl li.muted i{background:var(--line)}
.tl b{font-weight:800} .tl small{color:var(--mute);font-size:13px}
.tl span{display:block;font-size:15px;line-height:1.45;margin-top:4px}
.tl li.muted span{color:var(--mute);font-size:13px}
.insight h3{color:var(--ink)}
.ins{display:grid;gap:12px}
.insr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border-radius:14px;background:var(--raise)}
.insr b{font-weight:800} .insr small{display:block;color:var(--mute);font-size:13px}
.insr .pct{font-family:var(--disp);font-size:22px;color:var(--mute);align-self:center}
.insr .pct.hi{color:var(--bad)}
.insr p{grid-column:1/-1;margin:4px 0 0;font-size:13px;color:var(--ink)}
.chip.dots{min-width:46px;justify-content:center;font-size:17px;font-weight:800;letter-spacing:1px}
.chip.dots[aria-pressed="true"]{font-size:13px;letter-spacing:0}
.donebar.adv{background:var(--raise);color:var(--mute);margin-top:12px}
.ctip:empty{min-height:0;margin:0}
.row[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inote{display:block;color:var(--info)!important;font-weight:600;font-size:13px!important}
.addmore{display:block;width:100%;margin-top:4px;border:1.5px dashed var(--line);background:none;color:var(--acc-ink);font-weight:700;font-size:15px;border-radius:16px;padding:16px;cursor:pointer}
.addmore.ghosty{color:var(--mute);border-style:solid}
.week h3{display:flex;justify-content:space-between;align-items:baseline}
.week h3 small{color:var(--mute);font-weight:600;font-size:13px}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk div{background:var(--raise);border-radius:12px;padding:12px 8px;text-align:center}
.wk b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.2}
.wk span{font-size:12px;color:var(--mute)}
.wk i{font-style:normal;font-size:12px;margin-inline-start:4px;vertical-align:3px}
.wk i.up{color:var(--ok)} .wk i.dn{color:var(--bad)}
.wk i.nt{color:var(--mute)}
.rrow{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:start;font:inherit;cursor:pointer}
.rrow:first-child{border-top:0}
.rdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--mute);flex:0 0 auto}
.rdot.on{background:var(--ok);border-color:var(--ok)}
.rdot.half{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.wadd>.ta,.ingr>.ta{min-width:0;width:100%}
.card.form.dform{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.card.form.dform input{min-width:0;width:100%}
.sheet .dname{width:100%;font-size:22px;font-weight:800;border-color:transparent;background:none;padding:8px 4px;margin-bottom:4px}
.sheet .dname:focus{border-color:var(--line);background:var(--raise)}
.dstep{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;margin:20px 0 12px}
.dstep i{font-style:normal;flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#2B0E1A;display:grid;place-items:center;font-size:13px}
.dstep small{font-weight:400;color:var(--mute);font-size:12px}
.wadd{display:grid;grid-template-columns:1fr auto;gap:8px}
.wadd .ta{font-size:22px;text-align:center;padding:12px}
.wadd .btn{padding-inline:20px}
.wprog{margin-top:12px;font-size:13px}
.wprog .progress{margin-bottom:8px}
.wprog small{color:var(--mute)}
.wprog b{color:var(--ink)}
.wdiff{margin:4px 0 0;font-size:13px;text-align:center;color:var(--mute);background:var(--raise);border-radius:12px;padding:8px}
.wdiff.warn{color:var(--warn);font-weight:700}
.dnotes{width:100%}
.wlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wchip{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-weight:700;font-size:13px}
.wchip small{font-weight:400;color:var(--mute);font-size:12px}
.wchip button{border:0;background:none;color:var(--mute);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px}
.linkbtn{display:block;margin:12px auto 0;border:0;background:none;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;opacity:.8}
.chev{color:var(--mute);font-size:22px}
.ingr{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;align-items:center;margin-bottom:8px}
.ingr .ta{padding:12px}
.ingr .sel{padding:12px 4px}

.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pbtns label{text-align:center;cursor:pointer}
.suplist{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--mute)}
.suplist b{color:var(--ink);font-family:inherit;font-size:13px;font-weight:700}
.pgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pthumb{border:1px solid var(--line);background:var(--paper);border-radius:14px;font:inherit;color:#fff}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb span{position:absolute;font-weight:700;text-align:start;line-height:1.3;text-overflow:ellipsis}
.pthumb small{display:block;font-weight:400;opacity:.8;font-size:12px}
.pnew{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px}
.pnew img{height:110px;border-radius:12px;border:1px solid var(--line)}
.pview{margin:-4px 0 12px;border-radius:16px;overflow:hidden;background:#000;max-height:55vh;display:grid;place-items:center}
.pview img{max-width:100%;max-height:55vh;display:block}
.pview img.blur{filter:blur(6px);width:100%}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pgrid .ta{min-width:0;width:100%}
.xlist{display:grid;gap:8px;margin:16px 0 4px}
.xrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:start}
.xrow[aria-pressed="true"]{border-color:var(--acc)}
.xbox{border:2px solid var(--mute);display:grid;place-items:center;font-size:13px}
.xrow[aria-pressed="true"] .xbox{background:var(--acc);border-color:var(--acc);color:#2B0E1A}

.labseg{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.bbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.bbar .ta{min-width:0;width:100%}
.bcats{width:100%;display:grid;grid-template-columns:repeat(5,1fr);margin:4px 0 12px}
.bcats button{padding:8px 4px;font-size:13px}
.byield{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.byield label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mute)}
.byield .ta,.byield .sel{min-width:0;width:100%;padding:12px 8px;text-align:center}
.btxt{width:100%;line-height:1.6}
.bparse{margin:8px 4px 0;font-size:13px;color:var(--ok);min-height:1em}
.bname{font-size:22px !important}
.bmeta{margin:4px 0 12px;color:var(--mute);font-size:13px}
.bscale{margin-bottom:12px}
.btable{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.btable div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px}
.btable div:first-child{border-top:0}
.btable div:nth-child(even){background:var(--raise)}
.btable b{white-space:nowrap}
.bsteps{margin:16px 0 0;padding-inline-start:24px;display:grid;gap:8px;font-size:15px;line-height:1.55}
.bnotes{margin:12px 0 0;padding:12px 12px;border-radius:12px;background:var(--raise);font-size:13px;color:var(--mute);white-space:pre-wrap}

.cmeta{margin:4px 0 16px;color:var(--mute);font-size:13px}
.clbl{display:block;font-weight:800;font-size:15px;margin:16px 0 8px}
.cbig{width:100%;font-size:28px;text-align:center;padding:12px;font-weight:800}
.icbtn{display:block;border:0;background:none;color:inherit;font:inherit;text-align:start;padding:0;cursor:pointer;flex:1;min-width:0}
.addc{color:var(--acc);font-weight:700}
.byield.two{grid-template-columns:1fr 1fr;margin-top:12px}
.rcats{margin-bottom:8px}
.rcats button{padding:8px 4px;font-size:12px}
.suplist.cats{margin-top:8px}
.closecard{flex-wrap:nowrap;width:100%;border:1px solid var(--acc);background:var(--acc-soft);color:var(--ink);font:inherit;text-align:start;cursor:pointer;display:flex;align-items:center;gap:12px}
.closecard .chev{margin-inline-start:auto}
.clbl small{font-weight:400;color:var(--mute);font-size:12px}
.zbtn{display:block;text-align:center;cursor:pointer;margin-top:4px}
.ykg{display:grid;gap:8px;margin-top:12px;font-weight:700;font-size:13px}
.ykg small{font-weight:400;color:var(--mute);font-size:12px}
.ykg .ta{text-align:center;font-size:17px}
.aibox{margin:0 0 12px;padding:12px;border-radius:14px;background:var(--ok-soft);border:1px solid var(--line);font-size:13px;display:grid;gap:8px}
.aibox>b{color:var(--ok)}
.money h3{margin:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.mhead .seg button{padding:8px 12px;font-size:13px}
.mkpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk{padding:12px 16px;border:1.5px solid transparent}
.mk small{display:block;color:var(--mute);font-size:12px;font-weight:700}
.mk b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.2}
.mk span{font-size:12px;color:var(--mute)}
.mk.good{border-color:var(--ok)} .mk.good b{color:var(--ok)}
.mk.warn{border-color:var(--warn)} .mk.warn b{color:var(--warn)}
.mk.bad{border-color:var(--bad)} .mk.bad b{color:var(--bad)}
.mrows{margin-top:12px;display:grid;gap:8px}
.mrows>div,.mrow{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.mrow{border:0;background:var(--raise);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:12px 12px;cursor:pointer;margin-top:4px}
.mrow b{color:var(--acc-ink)}
.msub{font-size:12px;color:var(--mute);line-height:1.5}
.dcbig{width:100%;margin:8px 0 4px;padding:16px}

/* ---- ליטוש: נקי, יוקרתי, נעים. אותו מבנה ואותם כפתורים, רק תחושה ---- */
body{background:radial-gradient(1100px 520px at 50% -180px,rgba(184,74,104,.16),transparent 70%) no-repeat,var(--bg)}
:root[data-theme="light"] body{background:radial-gradient(1100px 520px at 50% -180px,rgba(200,50,90,.07),transparent 70%) no-repeat,var(--bg)}
.card,.list{border-color:var(--line)}
.row{border-top-color:var(--line)}
.cat h2{margin-bottom:12px}
.btn{border-radius:var(--r-tile);background:linear-gradient(180deg,#F7AEC2,var(--acc));box-shadow:0 8px 20px -8px rgba(244,154,178,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
:root[data-theme="light"] .btn{background:linear-gradient(180deg,#D94A70,var(--acc));box-shadow:0 8px 18px -8px rgba(200,50,90,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.step button{transition:transform .1s;box-shadow:var(--edge)}
.step button:last-child{background:linear-gradient(180deg,#F7AEC2,var(--acc));box-shadow:0 6px 14px -6px rgba(244,154,178,.6),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-theme="light"] .step button:last-child{background:linear-gradient(180deg,#D94A70,var(--acc))}
.chip{border-color:var(--line)}
:root[data-theme="light"] .seg{box-shadow:inset 0 1px 2px rgba(36,25,43,.06)}
.tabbar{border-top-color:var(--line)}
.tab svg{transition:background .2s}
.sheet{border-top-color:var(--line)}
.kpi{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:var(--r-tile)}
.kpi b{letter-spacing:-.01em}
.mk{border-radius:var(--r-tile);box-shadow:var(--edge);background:linear-gradient(180deg,var(--raise),color-mix(in srgb,var(--raise) 60%,var(--paper)))}
.ta,.field input,.field select{border-color:var(--line);transition:border-color .15s,box-shadow .15s}
@media (prefers-reduced-motion:reduce){.btn,.step button{transition:none}.btn:active,.step button:active{transform:none}}

/* טבעת קטגוריות (רכש לפי סוג) */
.ring{display:grid;gap:16px;justify-items:center;margin-top:16px}
.ring svg{width:150px;height:150px;display:block}
.ring .rc{font-family:var(--disp);font-size:15px;fill:var(--ink)}
.ring .rl{font-size:12px;fill:var(--mute)}
.rlist{display:grid;gap:0;width:100%}
.rli{display:grid;grid-template-columns:10px 1fr auto 46px;gap:12px;align-items:center;font-size:15px;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.rli:last-child{border-bottom:0}
.rli i{width:9px;height:9px;border-radius:50%}
.rli span{color:var(--mute);font-size:12px;margin-inline-start:8px}
.rli b{font-family:var(--ui);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.rli em{font-style:normal;color:var(--mute);font-size:12px;min-width:38px;text-align:left;font-variant-numeric:tabular-nums}
.cbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cbar .mrow{margin:0;box-shadow:var(--edge)}
.cbar .mrow span{font-size:13px}
.mrow.wide{width:100%;margin:12px 0 0}
.ta.wide{width:100%;margin-bottom:8px}
.crlist{display:grid;gap:8px;margin:8px 0}
.cr{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:14px;padding:12px 12px;box-shadow:var(--edge)}
.cr>div{flex:1;min-width:0}
.cr b{display:block;font-size:15px}
.cr small{color:var(--mute);font-size:12px}
.crs{margin-top:4px}
.btable div.over{background:var(--bad-soft)!important}
.btable div.over small{color:var(--bad);font-weight:700}
.btable small{color:var(--mute);font-size:12px}
.btable .agr{border:0;background:none;cursor:pointer;font-size:13px;padding:0 0 0 4px;opacity:.7}
.stdrow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.stdrow img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.stdrow label{flex:1;text-align:center;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.tcard{border:1px solid var(--line);background:var(--raise);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-align:start;box-shadow:var(--edge)}
.tcard img,.tcard .tph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tcard .tph{display:grid;place-items:center;font-size:30px;background:var(--paper)}
.tcard b{display:block;padding:8px 12px;font-size:15px}
.btn.wide{display:block;width:100%;text-align:center;text-decoration:none;margin-top:12px}
.ctags.wdays{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.ctags.wdays .chip.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.wdrow{width:100%;margin-top:12px}
.wdrow b{color:var(--mute);font-weight:600}
.ctl h3{margin:0 0 4px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}

.aitems{margin-top:12px}
.plinks{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.pbtns.busy label{pointer-events:none;opacity:.7}
.pthumb .spin{width:11px;height:11px;border-width:1.5px}
.udel{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--mute);display:grid;place-items:center;margin-inline-start:4px}
.udel svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.udel:active{background:var(--bad-soft);color:var(--bad)}
.mgrp{margin-top:12px}
.mgrp .srow small{font-size:12px}
.tbst{display:flex;align-items:center;gap:4px;white-space:nowrap}
/* 2.2: כרטיס הכנה, העברה, שעון אחד */
.irow{width:100%;border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.irow.off .nm b{color:var(--mute)}
.irow .schev{color:var(--mute);font-size:20px}
.pill svg{width:13px;height:13px;vertical-align:-2px;margin-inline-end:4px;fill:none;stroke:currentColor;stroke-width:2.2}
/* 2.2: Claude בעלות עובדים ובמתכונים */
.lai{background:var(--paper);border-radius:12px;padding:12px 16px;margin-bottom:16px;line-height:1.5}
.lai b{display:block;font-size:16px;margin-bottom:4px}
.lai ul{margin:0;padding-inline-start:20px;color:var(--ink);font-size:15px}
.lai .lact{margin:8px 0 0;font-size:15px;font-weight:600;color:var(--acc)}
.lai .lact em{font-style:normal;color:var(--ok);font-weight:700}
.rphoto{background:var(--paper);border-radius:12px;margin-bottom:12px;cursor:pointer}
.brow .st small .spin{width:11px;height:11px;margin-inline-end:4px;vertical-align:-1px}
.sgr .sv em{font-style:normal;color:#BF5AF2;font-weight:700}
.sgh{margin:0 16px 16px}
.aist.warn{color:var(--warn);font-weight:600}
.sgh2{min-height:34px}.sgh2 .st b,.sgh2 .sv{font-size:13px;color:var(--mute)}
/* 2.2: מתכונים — פשוט */
.bsearch{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:10px;padding:0 12px;height:38px;margin-bottom:12px}
.bsearch svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.bsearch input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;min-width:0}
.bchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:4px 16px 8px;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.bchips::-webkit-scrollbar{display:none}
.bchips .chip{flex:0 0 auto;scroll-snap-align:start;padding:8px 16px;border-radius:999px;font-size:15px}
.bempty{text-align:center;padding:36px 16px 12px;color:var(--mute);display:grid;gap:16px;justify-items:center}
.bempty b{color:var(--ink);font-size:17px}
.brow .st b{font-weight:500}
.brow .st small{font-size:13px}
.navedit{border:0;background:transparent;color:var(--acc);font:inherit;font-size:17px;font-weight:500;padding:8px 4px;white-space:nowrap}
.rscale{margin-bottom:24px}
.rscale button{font-size:15px;padding-inline:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ring3 .st b{font-weight:500}
.rq{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;color:var(--ink);white-space:nowrap}
.ring3.done .st b,.ring3.done .rq{color:var(--mute);text-decoration:line-through}
.rst{align-items:flex-start;padding-block:12px}
.rst i{font-style:normal;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.rst .st b{line-height:1.45;margin-top:0}
.rst.done{opacity:.45}
.rst.done i{background:var(--ok);color:#fff}
.rnotes{padding:12px 16px;font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.rfoot{text-align:center;margin-top:-8px}
.rname{font-size:22px;font-weight:700}
.rcats{width:100%;grid-template-columns:repeat(5,1fr);display:flex;flex-wrap:wrap;gap:8px;margin:-12px 0 24px}
.rcats .chip{padding:8px 12px;font-size:15px}
.rmeta2 .srow{min-height:52px}
.rin{display:flex;align-items:center;gap:8px}
.rin .fin{background:var(--raise);border-radius:8px;padding:8px 12px;width:76px;text-align:center;font-variant-numeric:tabular-nums}
.rin select.fin{width:auto;min-width:76px;text-align:start}
.rin em{font-style:normal;color:var(--mute);font-size:15px;min-width:30px}
.rta{display:block;resize:none;line-height:1.6;min-height:0}
.rdel{display:block;margin:4px auto 0}
.sbar{padding-inline:16px}
.sbar .btn{display:block;max-width:736px;margin:0 auto;pointer-events:auto;box-shadow:0 12px 30px -10px rgba(255,111,145,.55)}
/* v19: Claude ודוחות */
.ask{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:8px 8px 8px 8px;margin-bottom:12px}
.ask input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:8px 12px;outline:none}
.askgo{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center}
.askgo svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.asks{display:grid;gap:8px;margin-bottom:16px}
.qa b{font-size:15px;color:var(--mute);font-weight:600;margin-bottom:4px}
.qa p{margin:0;font-size:16px;line-height:1.5;color:var(--ink)}
.qa p.mute{color:var(--mute)}
.rhead{font-size:22px;font-weight:700;line-height:1.35;margin:4px 0 16px;letter-spacing:-.01em}
.rkpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rk{background:var(--paper);border-radius:12px;padding:12px 12px;display:grid;gap:4px}
.rk small{font-size:12px;color:var(--mute)}
.rk b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rk em{font-style:normal;font-size:12px;color:var(--mute);font-weight:600}
.rk em.up{color:var(--ok)}.rk em.down{color:var(--bad)}
.rsum{background:var(--paper);border-radius:12px;padding:12px 16px;display:grid;gap:8px}
.rsum p{margin:0;font-size:16px;line-height:1.5}
.ralert{align-items:flex-start}
.ralert .rdot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin:8px 16px 0 4px;background:var(--warn)}
.ralert .rdot.bad{background:var(--bad)}.ralert .rdot.ok{background:var(--ok)}
.ralert .st small{white-space:normal;line-height:1.4}
.rimp{font-weight:600;color:var(--ink);white-space:nowrap}
.racts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.racts li{display:flex;gap:12px;background:var(--paper);border-radius:12px;padding:12px 16px}
.racts li>i{font-style:normal;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.racts b{font-size:17px}
.racts p{margin:4px 0 0;font-size:15px;line-height:1.45;color:var(--mute)}
.rchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rchips .chip{padding:4px 12px;font-size:13px;border-radius:999px;background:var(--raise)}
.rchips .sv2{background:var(--ok-soft);color:var(--ok)}
/* v19: סרגל עליון קבוע, כותרת מתכווצת, בלי זנב ריק */
.navbar{padding-top:4px;position:fixed;top:0;left:0;right:0;z-index:9;height:auto;min-height:58px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,calc(50vw - 364px)) 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.navbar::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--line);opacity:0;transition:opacity .25s}
body.scrolled .navbar::before{opacity:1}
header::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);opacity:0;transition:opacity .25s;border-bottom:.5px solid var(--line);pointer-events:none;display:none}
header .wrap{padding-top:64px}
.lt,body.scrolled .lt{opacity:calc(1 - var(--sp,0));transform:translateY(calc(var(--sp,0) * -8px)) scale(calc(1 - var(--sp,0) * .06));transform-origin:100% 100%;transition:none;will-change:auto}
.lsub{color:var(--mute);opacity:calc(1 - var(--sp,0) * 1.5)}
.navtitle{opacity:0;transform:translateY(8px);transition:opacity .22s,transform .3s var(--spring);max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.scrolled .navtitle{opacity:1;transform:none}
main{padding-block:16px 128px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.has-tabbar main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body.has-bar main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.has-tabbar.has-bar main{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.cat,.grp,section.card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
.days,.jump{margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity;scroll-padding-inline:16px;overscroll-behavior-x:contain}
.days>*,.jump>*{scroll-snap-align:start}
.sheet{position:fixed;inset:auto 0 0;z-index:21;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;max-width:560px;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:shup .42s var(--spring);overscroll-behavior:contain}
@supports not (background:color-mix(in srgb,red 50%,blue)){.navbar::before{background:var(--bg)}}
header{top:env(safe-area-inset-top,0px);background:transparent;border-bottom:0;z-index:4}
.zcard{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;padding:12px 16px;margin-bottom:12px;cursor:pointer}
.zcard:active{background:var(--raise)}
.zcard .zic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:#5E5CE6;display:grid;place-items:center}
.zcard .zic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zcard .st{flex:1;display:grid}
.zcard .st b{font-size:17px}
.zcard .st small{color:var(--mute);font-size:13px}

/* =====================================================================
   מסעדות: ג'קו סטריט — אותו עיצוב, צבע כתום־זעפרן במקום ורוד
   ===================================================================== */
:root[data-site="jaco"][data-theme="light"]{--acc:#D9631E; --acc-ink:#B8500F; --acc-soft:rgba(217,99,30,.11)}
:root[data-site="jaco"] .btn:not(.ghost):not(.okb):not(.badb){background:linear-gradient(180deg,#FFAE70,var(--acc));box-shadow:0 8px 20px -8px rgba(255,138,61,.55),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-site="jaco"][data-theme="light"] .btn:not(.ghost):not(.okb):not(.badb){background:linear-gradient(180deg,#E4772F,var(--acc));box-shadow:0 8px 18px -8px rgba(217,99,30,.5),inset 0 1px 0 rgba(255,255,255,.25)}
:root[data-site="jaco"] .barin .btn:not(.ghost):not(.okb):not(.badb),:root[data-site="jaco"][data-theme="light"] .barin .btn:not(.ghost):not(.okb):not(.badb){background:#fff;color:#B8500F;box-shadow:none}
:root[data-site="jaco"] .glow{background:radial-gradient(55% 55% at 72% 42%,rgba(255,138,61,.20),transparent 72%),radial-gradient(38% 40% at 18% 30%,rgba(255,210,10,.06),transparent 70%)}
:root[data-site="jaco"] .glow.g{background:radial-gradient(55% 55% at 72% 42%,rgba(48,209,88,.20),transparent 72%)}
:root[data-site="jaco"] .glow.n{background:radial-gradient(55% 55% at 72% 42%,rgba(10,132,255,.10),transparent 72%)}
:root[data-site="jaco"] .barin,:root[data-site="jaco"] .sbar .btn{box-shadow:0 12px 30px -10px rgba(255,138,61,.55)}
:root[data-site="jaco"] .pav{background:linear-gradient(135deg,#FFB27A,#D9631E)}
/* מסך בחירת מסעדה */
.sitepick h1{margin:0 0 4px}
.sites{display:grid;gap:12px;margin:20px 0 16px}
.sitec{display:flex;color:var(--ink);font:inherit;text-align:start;padding:16px 16px;transition:transform .12s}
.sitec:active{transform:scale(.98)}
.sitec i{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px;color:#fff}
.sitec.s-rosie i{background:linear-gradient(160deg,#FF9AB4,#E0436A)}
.sitec.s-jaco i{background:linear-gradient(160deg,#FFB27A,#D9631E)}
.sitec span:not(.schev):not(.lock){flex:1;display:flex;flex-direction:column}
.sitec b{font-size:17px}
.sitec small{color:var(--mute);font-size:13px}
.sitec .schev{color:var(--mute);font-size:22px}
.sitec .lock svg{width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:1.8}
.sitec:disabled{opacity:.5;cursor:default}
.pill.chief{background:none;color:var(--label2);padding:0;font-weight:600;margin-inline-end:8px}
.chip.acc{min-width:40px;justify-content:center;margin-inline-end:8px;padding:8px 12px}
.chip.acc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}

/* שער הקבוצה: ג'קו סטריט. אותם משטחים ופונטים של האפליקציה, שלט רחוב עדין, כפתור ניטרלי */
.jsign{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:12px 24px 12px;margin:0 auto 8px;border:1px solid color-mix(in srgb,var(--ink) 34%,transparent);border-radius:8px;outline:1px solid color-mix(in srgb,var(--ink) 14%,transparent);outline-offset:4px;color:var(--ink)}
.jsign small{font:600 11px/1 var(--ui);letter-spacing:.34em;color:var(--mute);margin-inline-start:.34em}
.jsign b{font:400 28px/1.05 var(--disp);white-space:nowrap}
body.grpb .glow{display:none}
.auth.grp .sub{margin-top:8px}
.auth.grp .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.auth.grp .splash{min-height:60vh;display:grid;place-items:center}
.about .jsign{margin-bottom:8px}
#intro .in-sign{animation:rise .6s .1s both}
#intro:has(.in-sign){background:var(--bg)}
.sitesw{justify-self:start;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;font:600 13px var(--ui);cursor:pointer}
.sitesw i{font-style:normal;color:var(--acc)}
.qa{background:var(--paper);border-radius:12px;padding:12px 16px;position:relative}
.qa .qx{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border:0;border-radius:50%;background:var(--raise);color:var(--mute);font-size:16px;line-height:1;cursor:pointer}
.qa b{display:block;padding-inline-end:36px}
/* שער: בלי כרטיס, ישר על הרקע, כמו אפליקציות גדולות */
.auth.grp{background:transparent;display:block;min-height:100vh;padding:max(56px,9vh) 0 40px}
.auth.grp .authcard{background:none;border:0;box-shadow:none;max-width:400px;margin:0 auto;padding:0 24px;text-align:start}
.auth.grp .jsign{display:flex;width:max-content;margin:0 auto 44px}
.auth.grp .gt{font:700 26px/1.2 var(--ui);letter-spacing:-.01em;margin:0 0 4px;color:var(--ink)}
.auth.grp .gs{margin:0 0 4px;color:var(--mute);font-size:15px}
.auth.grp .gt+.field,.auth.grp .gs+.field{margin-top:24px}
.auth.grp .field{gap:8px;margin-bottom:16px}
.auth.grp .field label{font-size:13px;font-weight:600;color:var(--mute)}
.auth.grp .field input{height:52px;border-radius:12px;font-size:17px;border:0;background:var(--fill)}
.auth.grp .field input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.auth.grp .btn.full:not(.ghost):not(.okb):not(.badb){background:var(--ink);color:var(--bg);box-shadow:none;height:54px;border-radius:14px;font-size:17px;font-weight:700;margin-top:4px}
.auth.grp .err:empty{min-height:4px;margin:0}
.auth.grp .center{margin-top:24px}
.auth.grp .link{color:var(--tint);text-decoration:none;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;justify-content:flex-start;gap:12px;height:56px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);font:600 16px var(--ui);cursor:pointer;transition:border-color .15s,background .15s}
.opt i{width:20px;height:20px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);flex:none;transition:border .15s}
.opt[aria-checked="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,var(--raise))}
.opt[aria-checked="true"] i{border:6px solid var(--ink)}
.opt:focus-visible,.auth.grp .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.auth.grp h1{font:700 26px/1.2 var(--ui);letter-spacing:-.01em;margin:0 0 8px;text-align:start}
.auth.grp h1+.sub{margin:0 0 28px;text-align:start;font-size:15px}
.auth.grp .btn.ghost{height:50px;border-radius:14px}
/* ---------- נתונים: 4 מספרים, גרף, תשומת לב ---------- */
.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kp{background:var(--paper);border-radius:14px;padding:12px 12px 12px;min-width:0}
.kp small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.kp b{display:block;font:700 22px/1.15 var(--ui);letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:4px 0 4px;white-space:nowrap}
.kp span{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b.okt{display:block}
.badt{color:var(--bad)}.warnt{color:var(--warn)}
.dchart h3{margin:0 0 8px;font-size:15px}
@media (max-width:360px){.kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- קבוצה: Claude + כרטיס לכל מסעדה ---------- */
.carea{margin-bottom:16px}.carea button{padding:8px 4px;font-size:13px}
.brief{padding:16px 16px;margin-bottom:12px}
.bhd{display:flex;align-items:center;gap:12px;margin-bottom:12px}.bhd b{font-size:16px}.bhd small{margin-inline-start:auto;color:var(--mute);font-size:12px}
.bhd .ib{width:26px;height:26px}
.b3{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.b3 li{display:flex;gap:12px;align-items:baseline;font-size:15px;font-weight:600;line-height:1.35}
.b3 i{flex:none;width:8px;height:8px;border-radius:50%;transform:translateY(-2px)}
.b3 .ok i{background:var(--ok)}.b3 .warn i{background:var(--warn)}.b3 .todo i{background:var(--info)}
.bmore{font:600 14px var(--ui)}
.blong{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.bwait{margin:0;color:var(--mute);font-size:15px}
.scard{padding:16px 16px 8px;margin-bottom:12px}
.schd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.schd h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}.schd small{color:var(--mute);font-size:12px}
.sdot{width:10px;height:10px;border-radius:50%;background:#F49AB2}.s-jaco .sdot{background:#FF8A3D}
.sk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--raise);border-radius:12px;padding:12px 4px}
.sk div{text-align:center;min-width:0}.sk b{display:block;font:700 22px/1.1 var(--ui);font-variant-numeric:tabular-nums}.sk span{font-size:12px;color:var(--mute)}
.sm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.sm div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.sm small{display:block;font-size:12px;color:var(--mute)}.sm b{display:block;font:700 17px/1.2 var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.sm b.good{color:var(--ok)}.sm b.warn{color:var(--warn)}.sm b.bad{color:var(--bad)}.sm em{font-style:normal;font-size:12px;color:var(--mute)}
.stom{display:flex;align-items:baseline;gap:8px;margin:12px 4px 4px;font-size:15px}.stom span{color:var(--mute)}.stom small{color:var(--mute);margin-inline-start:auto}
.sal{list-style:none;margin:8px 0 8px;padding:0;display:grid;gap:8px}
.sal li{display:flex;align-items:center;gap:8px;font-size:15px}.sal i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn)}.sal .bad i{background:var(--bad)}
.sok{margin:8px 4px 12px;color:var(--ok);font-size:15px;font-weight:600}
.srep{margin:4px -16px 0;width:calc(100% + 32px);border-top:1px solid var(--line)!important;border-radius:0 0 18px 18px}
/* פריטים: קטגוריות מתקפלות */
.cath{font:800 15px var(--ui);text-align:start}
.cath > span:first-child{display:inline-flex;align-items:center;gap:8px}
.cath .ct{font-weight:700;font-size:13px;color:var(--mute)}.cath .chev{font-style:normal;margin-inline-start:8px}
.cath[aria-expanded="true"]{margin-bottom:8px}
.addopen{margin-bottom:16px}
.guide1{padding:16px;display:grid;gap:4px;margin-bottom:8px}.guide1 b{font-size:17px}.guide1 span{color:var(--mute);font-size:15px}

/* =====================================================================
   mizo 2.3 — ליטוש מקצועי. אותם כפתורים ואותה התנהגות; רק מראה, באייפון ובאנדרואיד
   ===================================================================== */
/* אנדרואיד: אותו פונט ואותה תחושה כמו באייפון */
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Assistant","Roboto","Rubik",system-ui,sans-serif}
body{color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font-family:var(--ui)}
/* רקע נקי: הזוהר הצבעוני למעלה עדין בהרבה */
:root[data-theme="light"] .glow{opacity:.25}
/* כפתורי + ו-− גדולים יותר: לחיצה בטוחה גם עם כפפות וידיים רטובות */
.step{flex:0 0 auto;overflow:hidden;height:40px;border-radius:10px}
.step button,.step button:last-child{width:46px;height:40px;font-size:22px}
.step output{position:relative;min-width:34px;font-size:17px}
/* הכנה שכבר בהזמנה: רקע עדין בצבע המסעדה */
.row.on{background:color-mix(in srgb,var(--acc) 7%,transparent)}
/* מספרים מיושרים בכל מקום */
.qty,.kp b,.sk b,.sm b,.tile b,.hq,.day span{font-variant-numeric:tabular-nums}
/* טעינה: שלד אפור במקום "טוען…" */
.skel{display:grid;gap:12px;padding:8px 0}
.skel i{display:block;height:56px;border-radius:12px;background:var(--paper);position:relative;overflow:hidden}
.skel i:nth-child(1){height:72px}.skel i:nth-child(4){width:70%}
.skel i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 5%,transparent),transparent);transform:translateX(100%);animation:skel 1.3s ease-in-out infinite}
@keyframes skel{to{transform:translateX(-100%)}}
/* גרף: עמודות מעוגלות, קו ממוצע מקווקו, בלי רשת */
.chart .avg{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart .grid{display:none}
/* הצעה לשיפור */
.ta.idea{width:100%;min-height:110px;resize:vertical;margin:8px 0 16px;line-height:1.45}
.ta.idea::placeholder{color:var(--mute2,rgba(235,235,245,.3))}
/* mizo: סימן שקט */

/* תנועה: קצרה ועדינה. מי שביקש פחות תנועה בטלפון — בלי תנועה בכלל */
main.enter{animation-duration:.24s}
/* לחיצה: משוב מיידי, בלי השהיה של 300ms באנדרואיד */
button,a,label,.row,.srow{touch-action:manipulation}
/* כפתור השליחה כשהוא לא לחיץ: מצב ברור וקריא, לא דהוי */
/* כפתור מושבת בפס: הצבעים בשכבה הרגועה למטה (בלי !important, כדי שתעבוד בבהיר ובכהה) */
.barin .btn:disabled{opacity:1}
/* אנגלית (משמאל לימין): אותו עיצוב במראה הפוך. עברית וערבית לא משתנות */
[dir="ltr"] .tl li::before{right:auto;left:6px}
[dir="ltr"] .row+.row::before,[dir="ltr"] .rrow+.rrow::before,[dir="ltr"] .srow+.srow::before{right:0;left:16px}
[dir="ltr"] .srow:has(.ib)+.srow:has(.ib)::before{right:0;left:58px}
[dir="ltr"] .row.on::after{right:auto;left:6px}
[dir="ltr"] .sw::after{right:auto;left:2px;transition:left .28s var(--spring)}
[dir="ltr"] .sw.on::after{right:auto;left:22px}
[dir="ltr"] .schev,[dir="ltr"] .chev-l{display:inline-block;transform:scaleX(-1)}
[data-lang="en"] .kp small,[data-lang="en"] .sk span,[data-lang="en"] .tile small,[data-lang="en"] .gh,[data-lang="en"] .cath > span:first-child{text-transform:capitalize}
/* ערבית: פונט המערכת של ערבית בכל טלפון */
[data-lang="ar"]{--ui:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic","Assistant",system-ui,sans-serif}

/* עלות מנות: מכפיל ומעליו אחוז רווח */
.dsb .sv bdi{display:block;text-align:end}.dsb .sv small{display:block;font-size:12px;color:var(--mute)}

/* מיזו: סימן מילולי. נקודת מנטה מעל ה-i היא החתימה */
.mzw{-webkit-user-select:none;user-select:none;display:inline-block;font:800 1em/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Assistant",system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);unicode-bidi:isolate}
.mzi{position:relative}
.mzi::after{content:"";position:absolute;left:50%;top:-.02em;width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;background:var(--mz)}
.bymz{margin:20px 0 0;text-align:center;font-size:12px;color:var(--mute)}
.bymz .mzw{font-size:13px;margin-inline-start:4px;color:var(--mute)}
.mzabout{text-align:center;margin:8px 0 12px}.mzabout .mzw{font-size:30px}.mzabout p{margin:8px 0 0;font-size:13px;color:var(--mute)}
.lsub .mzw{font-size:15px;color:var(--mute)}

/* הודעות קופצות למטה, מעל סרגל הלשוניות והכפתור הראשי — לא מסתירות את הכותרת */
.toast{transform:translateX(-50%) translateY(-8px);max-width:90vw;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.35);top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.has-bar .toast{bottom:calc(168px + env(safe-area-inset-bottom,0px))}

/* מסך כניסה: מיזו */
.mzsign{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto 8px}.mzsign .mzw{font-size:34px}.mzsign small{font-size:12px;color:var(--mute)}
.auth.grp .mzsign{margin:0 auto 36px}.about .mzsign{margin-bottom:4px}.in-sign.mzsign .mzw{font-size:52px}

/* אישורים נדרשים */
.pthumb{overflow:hidden;padding:0;cursor:pointer;aspect-ratio:3/4;position:relative}.pthumb .prev{position:absolute;top:6px;inset-inline-start:6px;font-style:normal;font-size:12px;padding:4px 8px}
.cr>.crb{display:flex;gap:8px;align-items:center;flex:none}
.cr small .rvr::before{content:" · "}

/* ===================== מראה רגוע (3.11) =====================
   פחות משטחים בצבע מלא, צבע מסעדה עדין (רוזה מעושנת / זעפרן רך), רקע נקי בלי הילה,
   כפתורים בלי קפיצות (מעבר רק על transform/צבע), ותנועה שקטה בכניסה ובלוגו */
:root{--lift:0 12px 40px rgba(0,0,0,.45);--rose1:#B84A68;--rose2:#F49AB2;--rose3:#FFD3DE;--on-ok:#fff;--info:#0A84FF;--info-soft:rgba(10,132,255,.15);--disp:var(--ui);--edge:none;--soft:none;--shadow:none;--r-card:12px;--r-tile:12px;--spring:cubic-bezier(.32,.72,0,1);--bg:#0D0E10;--paper:#17181B;--raise:#202226;--raise2:#2A2C30;--line:rgba(255,255,255,.07);--ink:#F3F3F1;--mute:rgba(236,236,240,.6);--mute2:rgba(236,236,240,.32);--acc:#D98E9F;--acc-ink:#EBA9B8;--acc-soft:rgba(217,142,159,.14);--on-acc:#1C0F13;--ok:#5CC08A;--ok-soft:rgba(92,192,138,.13);--warn:#E0A84E;--warn-soft:rgba(224,168,78,.11);--bad:#E5705F;--bad-soft:rgba(229,112,95,.13);--mz:#7FCBA8;--ease:cubic-bezier(.32,.72,0,1)}
:root[data-theme="light"]{--acc:#A84A62;--acc-ink:#9A4459;--acc-soft:rgba(180,87,109,.10);--on-acc:#fff}
:root[data-site="jaco"]{--acc:#D9A15E;--acc-ink:#E8B87E;--acc-soft:rgba(217,161,94,.14);--on-acc:#1E1408}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body,:root[data-theme="light"] body{background:var(--bg)}
.glow{pointer-events:none;z-index:0;opacity:.45;display:none}
b,strong,.num,.sv,.mk b,.sk b,.day span,.ct,.pill{font-variant-numeric:tabular-nums}
h1,h2,h3,.sht{text-wrap:balance}
.hint,.sub,.cmeta,small{text-wrap:pretty}

/* כפתורים: צבע מלא רק לפעולה הראשית, בלי צל צבעוני */
:root[data-theme] .btn:not(.ghost):not(.okb):not(.badb),:root[data-site] .btn:not(.ghost):not(.okb):not(.badb){background:var(--acc);color:var(--on-acc);box-shadow:none}
/* "הכל התקבל": ירוק כהה עם טקסט לבן — ניגודיות 5.4:1 (AA) בשני המצבים, אותו גודל */
:root[data-theme] .btn.okb,:root[data-theme="light"] .btn.okb,:root[data-site] .btn.okb{background:#26794C;color:#fff}

/* הפס התחתון: משטח שקט עם כפתור אחד בצבע, במקום פס ורוד מלא */
:root[data-theme] .barin{box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
:root[data-theme="light"] .barin{box-shadow:0 10px 30px -16px rgba(30,30,35,.25)}
:root[data-theme] .bar .sum small{color:var(--mute)}
:root[data-theme] .bar .sum small.shw{color:var(--acc-ink)}
:root[data-theme] .barin .btn,:root[data-site] .barin .btn:not(.ghost):not(.okb):not(.badb){background:var(--acc);color:var(--on-acc)}
:root[data-theme] .barin .btn:disabled,:root[data-site] .barin .btn:not(.ghost):not(.okb):not(.badb):disabled{background:var(--raise2);color:var(--mute);opacity:1}

/* ימים: היום שנבחר מסומן בעדינות, לא בצבע מלא */
.day[aria-pressed="true"],:root[data-theme] .day[aria-pressed="true"]{background:var(--acc-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 70%,transparent)}
.day[aria-pressed="true"] span{color:var(--acc-ink);opacity:1}

/* באנרים: רקע רך, אייקון בצבע, טקסט רגיל */
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.ok.solid{background:var(--ok-soft);border-color:transparent}

/* מעברים: רק מה שזז. לחיצה = כיווץ קטן, בלי שינוי גודל או משקל שגורם לקפיצה */
.btn,.srow,.day,.sitec,.mitem,.banner,.step button,.seg button,.tabbar button,.pthumb,.cat,.chip{transition-property:transform,background-color,color,box-shadow,opacity;transition-duration:.16s;transition-timing-function:var(--ease)}
.btn:active,.sitec:active,button.banner:active,button.srow:active,.mitem:active,.pthumb:active{transform:scale(.97)}
.seg button:active,.tabbar button:active{transform:scale(.94)}
.btn{cursor:pointer;min-height:44px}

/* שטחי תצוגה: נכנסים בעדינות פעם אחת (המסך לא נבנה מחדש בכל לחיצה, אז זה לא חוזר) */
@keyframes mzRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main .card,main .grp,main .mkpis .mk,main .dsec,.sitec,.authcard{animation:mzRise .38s var(--ease) both}
main .mkpis .mk:nth-child(2),.sitec:nth-child(2){animation-delay:.05s}
main .mkpis .mk:nth-child(3),.sitec:nth-child(3){animation-delay:.1s}
main .mkpis .mk:nth-child(4){animation-delay:.15s}

/* הלוגו: המילה עולה, הנקודה נוחתת, ואז נושמת לאט */
@keyframes mzWord{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes mzDot{0%{transform:translateY(-.5em) scale(.4);opacity:0}60%{transform:translateY(.04em) scale(1.12);opacity:1}100%{transform:none}}
@keyframes mzBreath{0%,86%,100%{transform:none}93%{transform:scale(1.3)}}
.mzsign .mzw,.mzabout .mzw,#intro .mzw{animation:mzWord .6s var(--ease) both}
.mzsign .mzi::after,.mzabout .mzi::after,#intro .mzi::after{animation:mzDot .7s .35s var(--ease) both,mzBreath 7s 1.2s ease-in-out infinite}

/* בחירת מסעדה: כרטיס שקט, אות בצבע המסעדה על רקע רך */
.sitec{align-items:center;gap:16px;width:100%;border:0;border-radius:16px;cursor:pointer;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);min-height:76px}
.sitec i,.sitec.s-rosie i,.sitec.s-jaco i{background:var(--sc-soft);color:var(--sc);font-weight:700}
.sitec.s-rosie{--sc:#D98E9F;--sc-soft:rgba(217,142,159,.15)}
.sitec.s-jaco{--sc:#D9A15E;--sc-soft:rgba(217,161,94,.15)}
:root[data-theme="light"] .sitec.s-rosie{--sc:#A84A62;--sc-soft:rgba(168,74,98,.10)}
:root[data-theme="light"] .sitec.s-jaco{--sc:#A86A22;--sc-soft:rgba(168,106,34,.10)}
.sitec:not(:disabled):hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 45%,var(--line))}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
.sitepick #logout{background:transparent;color:var(--mute);min-height:40px;font-weight:500}

/* אישור פרטיות */
.consent .cpts{margin:16px 0 8px;padding-inline-start:20px;color:var(--ink);font-size:15px;line-height:1.55}.consent .cpts li{margin:8px 0}
.consent .clinks{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 16px;font-size:15px}.consent .clinks a{color:var(--acc-ink,var(--acc));text-decoration:underline;text-underline-offset:3px}
.consent .cagree{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--raise);margin:0 0 12px;cursor:pointer;min-height:44px;font-size:15px;line-height:1.45}
.consent .cagree input{width:22px;height:22px;flex:none;margin:0 0 0;accent-color:var(--acc)}
.consent #logout{background:transparent;color:var(--mute);margin-top:8px}

/* ניגודיות AA במצב בהיר (בדיקה 3.11) */
:root[data-theme="light"]{--on-ok:#FFFFFF;--info-soft:#E8F0FB;--shadow:0 1px 2px rgba(36,25,43,.05),0 4px 14px rgba(36,25,43,.05);--lift:0 12px 36px rgba(36,25,43,.16);--rose1:#E9A3B6;--rose2:#C8325A;--rose3:#7E1734;--edge:inset 0 1px 0 #fff;--soft:0 1px 2px rgba(36,25,43,.04),0 10px 28px -14px rgba(36,25,43,.18);--info:#007AFF;--bg:#F4F3F0;--paper:#FFFFFF;--raise:#EEEDEA;--raise2:#E3E2DE;--line:rgba(30,30,35,.09);--ink:#1B1B1E;--mute2:rgba(40,40,48,.32);--ok-soft:rgba(47,143,91,.10);--warn-soft:rgba(168,107,18,.09);--bad-soft:rgba(194,70,59,.09);--mz:#2E8A66;--mute:rgba(40,40,48,.74);--ok:#26794C;--warn:#8A560B;--bad:#B23A30}
:root[data-theme="light"][data-site="jaco"]{--acc-soft:rgba(168,106,34,.10);--on-acc:#fff;--acc:#8E5718;--acc-ink:#774812}
/* הלוגו מונפש פעם אחת בכניסה, לא בכל מעבר מסך */
.mzseen .mzsign .mzw,.mzseen .mzabout .mzw,.mzseen .mzsign .mzi::after,.mzseen .mzabout .mzi::after{animation:none}
.lgl{margin:12px 0 0;text-align:center;font-size:13px}.lgl a{color:var(--mute);text-decoration:underline;text-underline-offset:3px}
/* סיסמה זמנית מהמנהל: ספרות גדולות וברורות */
.pwcode { font: 700 40px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-align: center; margin:16px 0 8px; color: var(--ink); user-select: all; }
/* קישורים בכותרת ובשורות במצב בהיר: צבע כהה יותר לניגודיות AA (4.5:1 לפחות) */
:root[data-theme="light"] .navback,:root[data-theme="light"] .tlink,:root[data-theme="light"] .navedit{color:var(--acc-ink)}
/* אחרי שליחה: ברור אם ההזמנה הגיעה לשרת או רק נשמרה בטלפון */
.success .sstat{display:inline-block;margin:12px auto 0;padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
.success .sstat.ok{background:var(--ok-soft,rgba(47,143,91,.12));color:var(--ok)}
.success .sstat.warn{background:var(--warn-soft,rgba(168,107,18,.1));color:var(--warn)}
:root[data-theme="light"] .success .sstat.ok{color:#1E6B43}
:root[data-theme="light"] .success .sstat.warn{color:#7A4E0C}
/* מסעדה שנוספה מחדר הבקרה: הצבע שנבחר לה */
:root[data-sitec]{--acc:var(--site-c);--acc-ink:color-mix(in srgb,var(--site-c) 62%,#fff);--acc-soft:color-mix(in srgb,var(--site-c) 14%,transparent);--on-acc:#fff}
:root[data-sitec][data-theme="light"]{--acc-ink:color-mix(in srgb,var(--site-c) 72%,#000)}
/* סקירת עיצוב 4.11: כפתור אישור מושבת בהיר (לא אפור כבד), סרגל לשוניות אטום יותר, מטרות מגע ≥40px */
#consentOk:disabled{background:var(--raise2);color:var(--mute);opacity:1}
.tabbar{position:fixed;inset:auto 0 0;z-index:7;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);background:color-mix(in srgb,var(--paper) 88%,transparent)}
.x{width:44px;height:44px}
/* ===== סקירת עיצוב אפליקציה, סבב 1 (4.11): שכבת סגנון בלבד, בלי להזיז כפתורים ===== */
/* באגים */
.pthumb span{font-size:12px}
.tab{font-weight:500}
:root[data-theme="light"] .tab:not([aria-selected="true"]){color:rgba(60,60,67,.78)}
:root[data-theme="light"] [stroke="#F1DDB8"]{stroke:#D4A95E}
:root[data-theme="light"] [style*="#F1DDB8"]{background:#D4A95E!important}
.step.sm button{width:44px;height:44px;font-size:22px}
/* טיפוגרפיה */
.dsh small,.kp small,.cath .ct{font-size:13px}
.kp span,.pthumb small,.day span{font-size:12px}
.jump button,.chip,.bchips .chip,.rcats .chip{font-size:15px}
.cath{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 16px;cursor:pointer;margin-bottom:8px;font-size:17px}
.seg.mini button{padding:4px 8px;font-size:13px}
/* רדיוסים: כרטיסים 12, כפתורים 14, גיליון 16, צ׳יפים 999 */
.kp,.pthumb,.day,.cath{border-radius:12px}
.badge{position:absolute;top:2px;left:calc(50% - 26px);min-width:20px;height:20px;border-radius:999px}
:root[data-theme] .barin{-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line);color:var(--ink);border-radius:22px;background:color-mix(in srgb,var(--paper) 94%,transparent)}
/* יעדי מגע ≥44 בלי לשנות מראה */
.burger{width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative}.burger::after{content:"";position:absolute;inset:-4px}
.seg button{min-height:32px;position:relative}.seg button::after{content:"";position:absolute;inset:-6px 0}
.jump button{min-height:44px}
.tlink{color:var(--acc);cursor:pointer;min-height:44px;padding:0 8px;display:inline-flex;align-items:center}
.auth.grp .link,#swap{min-height:44px;display:inline-flex;align-items:center}
/* שברון במקום ▾ */
.bmore .chev{vertical-align:2px;margin-inline-start:4px}.bmore[aria-expanded="true"] .chev{transform:rotate(135deg);vertical-align:-1px}
.dsh .chev,.cath .chev,.bmore .chev{display:inline-block;font-size:0;width:8px;height:8px;border:solid var(--mute);border-width:0 0 1.75px 1.75px;transform:rotate(-45deg);transition:transform .2s var(--ease, cubic-bezier(.32,.72,0,1))}
.dsh[aria-expanded="true"] .chev,.cath[aria-expanded="true"] .chev{transform:rotate(135deg)}
/* נתונים: ארבעת ה-KPI כקבוצה אחת */
.kpi4{display:grid;margin:4px 0 12px;gap:0;background:var(--paper);border-radius:12px;overflow:hidden}
.kpi4 .kp{background:none;border-radius:0}
.kpi4 .kp+.kp{box-shadow:inset -.5px 0 0 var(--line)}
/* דמו */
:root[data-theme="light"] .demo-pill{background:color-mix(in srgb,#fff 82%,transparent);color:var(--ink);border:.5px solid var(--line)}
/* ===== סקירה סופית 4.11 ===== */
/* קבלות: רק השם נחתך; סכום ותאריך בשורה משלהם, LTR */
.pthumb span{inset:auto 0 0;white-space:normal;-webkit-box-orient:vertical;overflow:hidden;padding:32px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.86) 45%);display:block;-webkit-line-clamp:unset}
.pthumb .pt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700}
.pthumb span small{display:block;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}
/* יעדי מגע ≥44 בלי לשנות מראה */
#noteBtn,#moreBtn,#moreProd,#navBack,#wasteBtn,#gAskGo,.bmore,.step button{position:relative}
#noteBtn::before,#moreBtn::before,#moreProd::before,#navBack::before,#wasteBtn::before,#gAskGo::before,.bmore::before,.step button::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
/* רדיוסים: 7/10/18/22 → 8/12/16 */
.approve{border-radius:16px}
.step,.btn.small{border-radius:12px}
.ib{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto;border-radius:8px}
.bmore{margin-top:12px;border:0;background:var(--raise);color:var(--ink);padding:8px 12px;cursor:pointer;border-radius:12px}
.notebox,.kpi{border-radius:16px}
.hx span,.ta,.field input,.field select,.sel,.num,.udel,.bsearch,.zcard .zic{border-radius:12px}
.xbox{width:24px;height:24px;flex:0 0 auto;border-radius:8px}

/* מסך ייצור (טאבלט במטבח): מסך מלא, קריאה בלבד. שם 22, מספר 34 tabular, יציאה 44 */
.pmode{max-width:1024px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 32px}
.pm-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 16px}
.pm-ht b{display:block;font-size:22px;line-height:1.2;color:var(--ink)}
.pm-ht small{display:block;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.pm-q2{flex:1 1 100%;display:flex;align-items:center;gap:8px;justify-content:flex-end}.pm-q2 span{margin-inline-end:auto}.pm-q2 span{font-size:17px;font-weight:600;color:var(--ink)}
.pm-x{min-width:88px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}
.pm-c{font-size:15px;font-weight:600;color:var(--mute);margin:24px 0 8px}
.pm-l{background:var(--paper);border-radius:16px;overflow:hidden}
.pm-r{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:12px 16px;border-top:1px solid var(--line)}
.pm-r:first-child{border-top:0}
.pm-n b{display:block;font-size:22px;line-height:1.25;font-weight:600;color:var(--ink)}
.pm-n small{display:block;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.pm-q{font-size:34px;line-height:1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:48px;text-align:end}
.pm-r.goal .pm-n b,.pm-r.goal .pm-q{color:var(--ok)}
.pm-e{font-size:22px;color:var(--mute);text-align:center;padding:48px 0;margin:0}

/* חדר נתונים: כרטיס = תווית, מספר גדול אחד, משפט אנושי */
[data-room] > .lsub{margin:0 0 8px}
.rcard .st > small{font-size:13px;color:var(--mute)}
.rcard .st .rbig{display:block;font-size:34px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);margin:4px 0}
.rcard .rbig.good{color:var(--ok)}
.rcard .rbig.warn,.rcard .rbig.warnt{color:var(--warn)}
.rcard .rbig.bad,.rcard .rbig.badt{color:var(--bad)}
.rline{display:block;font-size:15px;color:var(--mute)}

/* badge בבהיר: לבן על הכתום הכהה (AA) */
:root[data-theme="light"] .badge{color:#fff}
/* בלי ריפוד ברירת המחדל של הדפדפן (1px 6px) — התוכן ממורכז ב-grid */
.burger,.step button{padding:0}
/* + בסטפר בבהיר: גוון כהה של המותג (AA) */
:root[data-theme="light"] .step button:last-child{color:var(--acc-ink)}

/* =====================================================================
   מיזו — בלוק טוקנים אחד (הצעה, "מסך של טסלה", 4.11.2026)
   שכבת סגנון בלבד: אין שינוי HTML, אין כפתור שזז. שכבת "כינויים" (סעיף 9)
   ממפה את 30 השמות הישנים ל-10 החדשים, כך שכל הכללים הקיימים ממשיכים לעבוד.
   מקורות: HIG color, dark-mode, materials, tab-bars, sheets, typography, motion,
   accessibility, loading, feedback. הסולם הסגור: apple-grade-ui-designer §2–§5.
   ===================================================================== */

/* ---------- 1. צבע: 10 טוקנים בלבד. כהה = ברירת מחדל ---------- */
:root{
  --bg:#0B0A0D;                         /* systemGroupedBackground (כהה) */
  --surface:#1C1C1E;                    /* secondarySystemGroupedBackground */
  --surface2:#2C2C2E;                   /* מילוי בתוך משטח: סטפר, סגמנט, שדה */
  --label:#F2F2F7;
  --label2:rgba(235,235,245,.6);        /* 5.3–6.3:1 על כל המשטחים */
  --separator:rgba(84,84,88,.6);
  --tint:#D98E9F;                       /* רוזי. רק לחיץ/נבחר. 5.5–7.8:1 */
  --green:#30D158;
  --orange:#FF9F0A;
  --red:#FF453A;
  /* נגזרים (לא צבעים חדשים, רק ערבוב של הטוקנים) */
  --tint-soft:color-mix(in srgb,var(--tint) 15%,transparent);
  --green-soft:color-mix(in srgb,var(--green) 14%,transparent);
  --orange-soft:color-mix(in srgb,var(--orange) 14%,transparent);
  --red-soft:color-mix(in srgb,var(--red) 14%,transparent);
  --on-tint:#1C0F13;                    /* טקסט על כפתור טינט: 7.4:1 */
  --on-solid:#000;                      /* טקסט על ירוק/אדום מלא בכהה (לבן על #30D158 = 2.0:1) */
  --scrim:rgba(0,0,0,.4);
  --fill:color-mix(in srgb,var(--label2) 45%,transparent); /* מסילת מתג כבוי (systemFill) */
}
:root[data-theme="light"]{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface2:#EBEBF0;                   /* טינט #A84A62 עליו = 4.63:1; ה-+ בסטפר ב---acc-ink = 5.28:1 */
  --label:#1C1C1E;
