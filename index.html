<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16121D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="רוזי">
<title>הזמנות רוזי</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Secular+One&display=swap">
<style>
/* Rosie — "rose garden at night". Plum-night surfaces, petal-pink actions, leaf-green for done.
   Display numbers & brand: Secular One. Everything else: Assistant. Dark by default, day mode for bright kitchens. */
:root{
  --bg:#16121D; --paper:#1F1A28; --raise:#2A2335; --ink:#F5EFF7; --mute:#A99FB6; --line:#332B3F;
  --acc:#F49AB2; --acc-ink:#FFB8CA; --acc-soft:rgba(244,154,178,.13); --on-acc:#2B0E1A;
  --ok:#82D9AC; --ok-soft:rgba(130,217,172,.12); --on-ok:#0E2A1C;
  --warn:#F3C675; --warn-soft:rgba(243,198,117,.12);
  --bad:#FF8F80; --bad-soft:rgba(255,143,128,.13);
  --info:#A8BEFF; --info-soft:rgba(168,190,255,.12);
  --shadow:none; --lift:0 12px 40px rgba(0,0,0,.45);
  --rose1:#B84A68; --rose2:#F49AB2; --rose3:#FFD3DE;
  --ui:"Assistant","Arial Hebrew",Arial,sans-serif; --disp:"Secular One","Assistant",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F3F6; --paper:#FFFFFF; --raise:#F2ECF1; --ink:#24192B; --mute:#776B80; --line:#E9E0E7;
  --acc:#C8325A; --acc-ink:#A3264A; --acc-soft:#FBE8EE; --on-acc:#FFFFFF;
  --ok:#1F8A57; --ok-soft:#E4F4EB; --on-ok:#FFFFFF;
  --warn:#A8670A; --warn-soft:#FDF1DD; --bad:#BF3328; --bad-soft:#FCE9E6; --info:#2E62B0; --info-soft:#E8F0FB;
  --shadow:0 1px 2px rgba(36,25,43,.05),0 4px 14px rgba(36,25,43,.05); --lift:0 12px 36px rgba(36,25,43,.16);
  --rose1:#E9A3B6; --rose2:#C8325A; --rose3:#7E1734;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body.locked{overflow:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{display:grid;place-items:center;min-height:85vh}

/* petal logo + avatar */
.logo{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 14px}
.logo.sm{width:38px;height:38px;margin:0}
.rose{width:100%;height:100%;display:block;overflow:visible}
.rose .p1{fill:var(--rose1)}
.rose .p2{fill:var(--rose2)}
.rose .c{fill:var(--rose3)}
.rose .s{fill:none;stroke:var(--rose2);stroke-width:1.4;stroke-linecap:round}
.ci{flex:0 0 auto;color:var(--acc)}
.cat h2 > span:first-child{display:inline-flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.lg{width:52px;height:52px;font-size:18px;background:var(--acc-soft);color:var(--acc-ink);border:0}

/* login */
.auth{min-height:92vh;display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.authcard{width:100%;max-width:380px;padding:34px 24px 24px;text-align:center}
.authcard h1{font-family:var(--disp);font-weight:400;font-size:30px;margin:0}
.authcard .sub{margin:2px 0 24px;color:var(--mute);font-size:15px}
.authcard .field{text-align:right}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600;color:var(--mute)}
.field input,.field select,.notebox textarea,.ta{border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px}
.field input:focus,.notebox textarea:focus,.ta:focus,.search:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}
.link{background:none;border:0;color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.center{text-align:center;margin-top:16px;font-size:15px;color:var(--mute)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:11px}
.brand b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.1}
.brand small{display:block;color:var(--mute);font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.days::-webkit-scrollbar,.jump::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:7px 14px;min-width:66px;text-align:center;cursor:pointer}
.day b{display:block;font-size:14.5px;font-weight:700}
.day span{display:block;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.day[aria-pressed="true"] span{color:inherit;opacity:.75}
.dot{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.jump{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.jump button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.jump button:active{background:var(--raise)}
.jump i{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
main{padding-block:14px 130px}
body.has-tabbar main{padding-bottom:200px}
section.cat{scroll-margin-top:200px}

/* bottom tab bar */
.tabbar{position:fixed;inset:auto 0 0;z-index:7;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;position:relative;display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:14px}
.tab svg{padding:3px 14px;box-sizing:content-box;border-radius:999px}
.tab[aria-selected="true"]{color:var(--acc-ink)}
.tab[aria-selected="true"] svg{background:var(--acc-soft)}
.badge{position:absolute;top:2px;left:calc(50% - 26px);min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--warn);color:#2A1C05;font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid var(--paper)}

/* status card + order journey */
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 6%,var(--paper)),var(--paper) 60%);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.when b{display:block;font-size:18px;font-weight:800}
.when small{color:var(--mute);font-size:13.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--raise);color:var(--mute)}
.pill.open,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad);white-space:normal}
.track{flex-basis:100%;display:flex;list-style:none;margin:6px 0 0;padding:0}
.track li{flex:1;position:relative;display:grid;justify-items:center;gap:5px;font-size:12.5px;color:var(--mute);text-align:center}
.track li::before{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track i{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.track li.done{color:var(--ok)} .track li.done i{background:var(--ok);border-color:var(--ok)} .track li.done::before{background:var(--ok)}
.track li.now{color:var(--ink);font-weight:700} .track li.now i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.track li.bad{color:var(--bad);font-weight:700} .track li.bad i{background:var(--bad);border-color:var(--bad)}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;text-align:right;font:inherit;color:var(--ink);background:var(--paper);border-radius:18px;padding:13px 15px;margin-bottom:10px;flex-wrap:wrap}
.banner > svg{flex:0 0 auto}
.banner > span:first-of-type{flex:1;min-width:180px;font-size:15px}
.banner i{font-style:normal;font-weight:700;color:var(--warn);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)} .banner.warn > svg{color:var(--warn)}
button.banner{cursor:pointer}
.banner.ok > svg{color:var(--ok)} .banner.ok.solid{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.info{background:var(--info-soft)} .banner.info > svg{color:var(--info)}
.banner.sugg{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent)} .banner.sugg > svg{color:var(--acc)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .banner.bad b{color:var(--bad)}
.bbtns{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.x{border:0;background:none;color:var(--mute);font-size:16px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:0 0 auto}
.x:hover{background:var(--raise)}

/* tools */
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools.end{justify-content:center;margin-top:20px}
.search{flex:1 1 90px;min-width:0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit}
.search::placeholder,.ta::placeholder,textarea::placeholder,input::placeholder{color:var(--mute);opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip svg{color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] svg{color:inherit}
.notebox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:grid;gap:6px}
.notebox label{font-size:14px;font-weight:700;color:var(--mute)}
.notebox textarea{resize:vertical;min-height:54px}
.ta{resize:vertical}
.seg{display:inline-flex;gap:3px;background:var(--raise);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* lists */
section.cat{margin-bottom:20px}
.cat h2{font-size:15px;font-weight:800;color:var(--ink);margin:0 6px 8px;display:flex;justify-content:space-between;align-items:baseline}
.cat h2 .ct{font-weight:700;font-size:13.5px;color:var(--acc-ink)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:66px;transition:background .15s}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:700;display:block;font-size:16.5px;line-height:1.25}
.row .nm small{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.row.on{background:var(--acc-soft);box-shadow:inset -4px 0 0 var(--acc)}
.row.off{opacity:.45}
.okt{display:block;color:var(--ok)!important}
.step{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.step button{width:44px;height:44px;border:0;border-radius:50%;background:var(--raise);color:var(--ink);font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button:last-child{background:var(--acc);color:var(--on-acc)}
.step button:active{transform:scale(.92)}
.step button:disabled{opacity:.3;cursor:default;transform:none}
.step output{min-width:36px;text-align:center;font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
.row:not(.on) .step output{color:var(--mute);opacity:.6}
.step.sm button{width:36px;height:36px;font-size:19px}
.step.lg{justify-content:center;gap:18px}
.step.lg button{width:56px;height:56px;font-size:28px}
.step.lg output{font-size:34px;min-width:64px}
output.chg{color:var(--acc-ink)!important;opacity:1!important}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--mute);background:transparent;cursor:pointer;flex:0 0 auto;position:relative;opacity:.8}
.check::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);font-size:22px;font-weight:800;opacity:0;transition:opacity .15s}
.check:hover::after,.check:focus-visible::after{opacity:.6}
.check:active{background:var(--ok-soft);border-color:var(--ok)}
.check:disabled{cursor:default;opacity:.35}
.qty{font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center;line-height:1.1}
.qty small{display:block;font-family:var(--ui);font-weight:600;font-size:11.5px;color:var(--mute)}
.ahead{color:var(--info);font-weight:600}
.tag{font-style:normal;font-size:12.5px;font-weight:700;border-radius:8px;padding:1px 8px;display:inline-block;margin-top:3px}
.tag.new{background:var(--info-soft);color:var(--info)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.tag.down{background:var(--raise);color:var(--mute)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.lack{display:grid;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:var(--warn-soft)}
.lack b{color:var(--warn);font-size:15.5px}
.lack small{color:var(--mute);font-size:13.5px}
.lack .seg{display:flex}.lack .seg button{flex:1}
.num{width:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:9px 4px;text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.sel{border:1.5px solid var(--line);border-radius:12px;background:var(--raise);color:var(--ink);padding:9px 10px;font:inherit}
.sel.full{width:100%;padding:13px;font-size:16px}

/* production */
.progress-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:15px}
.progress-card b{font-family:var(--disp);font-weight:400;font-size:20px}
.progress{height:10px;background:var(--raise);border-radius:99px;overflow:hidden;margin-top:9px}
.progress div{height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.hint{font-size:13.5px;color:var(--mute);margin:0 6px 12px}
.donebar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:15px;border-radius:18px;padding:14px 16px;cursor:pointer;margin-top:4px}
.donelist{margin-top:8px}
.drow{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:right;color:var(--ink);cursor:pointer;font:inherit}
.drow:first-child{border-top:0}
.drow .nm b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--mute)}
.tick{width:32px;height:32px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center;font-size:16px;font-weight:800;flex:0 0 auto}
.done-all{background:var(--ok-soft)!important;border-color:transparent!important;color:var(--ok)}
.done-all b{color:var(--ok)!important}

/* approval */
.approve{background:var(--paper);border-radius:22px;border:2px solid var(--warn);padding:16px;margin-bottom:14px}
.atop b{display:block;font-size:18px;font-weight:800}
.atop small{color:var(--mute);font-size:14px}
.anote{display:flex;gap:8px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0 0;font-size:15px}
.anote svg{color:var(--info);flex:0 0 auto;margin-top:3px}
.ahint{font-size:13.5px;color:var(--mute);margin:10px 0 0}
.alist{margin-top:8px}
.arow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-weight:700;display:block}
.arow .nm small{color:var(--mute);font-size:13px}
.abtns,.sbtns{display:flex;gap:8px;margin-top:16px}
.abtns .btn,.sbtns .btn{flex:1}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer;background:var(--acc);color:var(--on-acc);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.big{padding:15px 24px;font-size:17px}
.btn.ghost{background:var(--raise);color:var(--ink)}
.btn.okb{background:var(--ok);color:var(--on-ok)}
.btn.badb{background:var(--bad);color:#2A0B07}
:root[data-theme="light"] .btn.badb{color:#fff}
.btn.badt{color:var(--bad)}
.btn.small{padding:9px 15px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* bottom send bar */
.bar{position:fixed;inset:auto 0 0;z-index:6;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
body.has-tabbar .bar{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.barin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--raise);border:1px solid var(--line);border-radius:22px;padding:10px 10px 10px 16px;padding-inline-start:18px;box-shadow:var(--lift);pointer-events:auto}
.bar .sum{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px;font-size:15px}
.bar .sum b{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.bar .sum small{flex-basis:100%;color:var(--mute);font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,5,12,.6);z-index:20;animation:fade .15s}
.sheet{position:fixed;inset:auto 0 0;z-index:21;background:var(--paper);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 16px}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800}
.sheet .big{font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0 18px;color:var(--acc-ink)}
.sheet .hint{margin:10px 0 0;text-align:center}
.sheet .field{margin-top:14px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.me b{display:block;font-size:18px}
.me small{color:var(--mute)}
.mitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--raise);color:var(--ink);border-radius:16px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;text-align:right}

.more{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--acc-ink);font-weight:700;padding:14px;cursor:pointer;font-size:15px}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1fr 54px 62px 84px;gap:8px;align-items:center;padding:11px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:right;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;width:100%}

.trx span.wide{flex-basis:100%;text-align:right;background:none;padding:4px 0 0;color:var(--mute);font-size:13px}
.badv{color:var(--bad)}
.hist{display:grid}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:right;font:inherit;width:100%;cursor:pointer}

function stats() {

      const p = perItem[i] = perItem[i] || { k: i, tot: 0, n: 0, wd: [0, 0, 0, 0, 0, 0, 0], waste: 0, missing: 0 };
      p.tot += v; p.n++; p.wd[w] += v;
    });
    const miss = (o.received && o.received.missing) || {};

    const sh = shortsOf((D.prod || {})[k]);

  });

    const P = (D.prod || {})[k], its = ((P && P.items) || {}), dl = parse(k).getTime() + DEAD * 3600000;
    const keys = Object.keys(q).filter((i) => +q[i] > 0); if (!keys.length || !Object.keys(its).length) return;
    onTimeN++;
    if (keys.every((i) => its[i] && its[i].done && its[i].at && its[i].at <= dl)) onTimeOk++;
    if (Object.keys(shortsOf(P)).length) shortDays++;
  });
  const waste = D.waste.filter((w) => w.day <= D.today);
  waste.forEach((w) => { const p = perItem[w.k] = perItem[w.k] || { k: w.k, tot: 0, n: 0, wd: [0, 0, 0, 0, 0, 0, 0], waste: 0, missing: 0 }; p.waste += +w.qty || 0; });

}

function weekStats(from, to) {

  Object.keys(D.prod || {}).forEach((k) => { if (k >= from && k <= to) short += Object.keys(shortsOf(D.prod[k])).length; });

  const keep = {}; ["n", "u", "p", "note", "vapid", "nN"].forEach((id) => { const el = $(id); if (el) keep[id] = el.value; });
  $("app").innerHTML = html;
  Object.keys(keep).forEach((id) => { const el = $(id); if (el) el.value = keep[id]; });
  if (fid) { const el = $(fid); if (el) { el.focus({ preventScroll: true }); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  if (Math.abs(window.scrollY - sy) > 2) window.scrollTo(0, sy);
  document.body.classList.toggle("locked", !!S.sheet);
}

/* ---------- events ---------- */
document.documentElement.dataset.theme = store("rosie-theme") === "light" ? "light" : "dark";
const app = $("app");
app.addEventListener("submit", (e) => {
  if (e.target.id === "authF") return S.authMode === "signup" ? doSignup(e) : doLogin(e);
  e.preventDefault();
  if (e.target.id === "addF") { const n = $("nN").value.trim(), c = $("nC").value, d = parseInt($("nD").value, 10) || 4; if (n) { addItem(n, c, d); $("nN").value = ""; } }
  if (e.target.id === "vapidF") setDoc(doc(db, "settings", "app"), { vapid: $("vapid").value.trim() }, { merge: true }).then(() => toast("נשמר ✓")).catch(() => toast("לא נשמר"));
});
app.addEventListener("click", (e) => {
  if (e.target.id === "scrim") { S.sheet = null; return render(); }
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset, sh = S.sheet;
  if (t.id === "swap") { S.authMode = S.authMode === "login" ? "signup" : "login"; S.authErr = ""; render(); }
  else if (t.id === "logout") { clearTimeout(flushTimer); S.sheet = null; render(); flush().then(runAutoNow).finally(() => signOut(auth)); }
  else if (t.id === "menu") { S.sheet = { type: "menu" }; render(); }
  else if (t.id === "sClose") { S.sheet = null; render(); }
  else if (t.id === "pushBtn") enablePush();
  else if (t.id === "themeBtn") { const th = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = th; store("rosie-theme", th); render(); }
  else if (d.jump) { const el = $(d.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (d.day) { flush(); runAutoNow(); S.day = d.day; watchDay(); render(); }
  else if (d.tab) { S.tab = d.tab; if (d.tab === "data" && !S.data) loadData(); render(); window.scrollTo(0, 0); }
  else if (d.goapprove) { flush(); runAutoNow(); S.tab = "prod"; if (S.day !== d.goapprove) { S.day = d.goapprove; watchDay(); } render(); window.scrollTo(0, 0); }
  else if (d.inc) bump(d.inc, 1);
  else if (d.dec) bump(d.dec, -1);
  else if (d.ainc) { approveDraft[d.ainc] = approvalQty(d.ainc) + 1; render(); }
  else if (d.adec) { approveDraft[d.adec] = Math.max(0, approvalQty(d.adec) - 1); render(); }
  else if (t.id === "approve") approve();
  else if (t.id === "reject") { S.sheet = { type: "reject", change: hasApproved(O()) }; render(); }
  else if (t.id === "sRejectOk") rejectOrder(($("rjnote") || {}).value || "");
  else if (d.done) { const prev = madeSoFar(d.done); S.sheet = { type: "done", k: d.done, prev, made: Math.max(0, prodQty(d.done) - prev), mode: "later" }; render(); }
  else if (d.smode) { const n = $("shnote"); if (n) sh.note = n.value; sh.mode = d.smode; render(); }
  else if (d.smade) { const n = $("shnote"); if (n) sh.note = n.value; sh.made = Math.max(0, sh.made + +d.smade); render(); }
  else if (t.id === "sDoneOk") confirmDone();
  else if (d.undo) { S.sheet = { type: "undo", k: d.undo }; render(); }
  else if (t.id === "sUndoOk") { setProd(sh.k, { done: false }); S.sheet = null; render(); }
  else if (t.id === "toggleDone") { S.showDone = !S.showDone; render(); }
  else if (t.id === "wasteBtn") { S.sheet = { type: "waste", k: "", qty: 1, reason: REASONS[0] }; render(); }
  else if (d.wq) { sh.qty = Math.max(0.5, sh.qty + +d.wq); render(); }
  else if (d.wr) { sh.reason = d.wr; render(); }
  else if (t.id === "sWasteOk") saveWaste();
  else if (t.id === "recvAll") receiveAll({});
  else if (t.id === "recvMiss") { const pre = {}; Object.entries(shortsOf(S.todayProd)).forEach(([k, x]) => (pre[k] = x.n)); S.sheet = { type: "missing", missing: pre }; render(); }
  else if (d.minc) { sh.missing[d.minc] = (sh.missing[d.minc] || 0) + 1; render(); }
  else if (d.mdec) { sh.missing[d.mdec] = Math.max(0, (sh.missing[d.mdec] || 0) - 1); render(); }
  else if (t.id === "sMissOk") receiveAll(sh.missing);
  else if (t.id === "useSugg") applySuggestion("avg");
  else if (t.id === "useLast") applySuggestion("last");
  else if (t.id === "offSugg") { S.suggOff[S.day] = true; render(); }
  else if (t.id === "noteBtn") { S.noteOpen = !S.noteOpen; render(); if (S.noteOpen) { const n = $("note"); if (n) n.focus(); } }
  else if (d.toggle) { const it = items(true).find((x) => x.k === d.toggle); if (it) catWrite(it.k, { active: it.active === false }); }
  else if (t.id === "only") { S.onlyOrdered = !S.onlyOrdered; S.sheet = null; render(); }
  else if (t.id === "sInoteOk" || t.id === "sInoteDel") {
    const txt = t.id === "sInoteDel" ? "" : (($("inoteIn") || {}).value || "").trim().slice(0, 80), k = sh.k, day = S.day;
    S.sheet = null; render();
    setDoc(doc(db, "orders", day), { date: day, itemNotes: { [k]: txt } }, { merge: true }).then(() => toast(txt ? "ההערה נשמרה. המטבח יראה אותה" : "ההערה נמחקה")).catch(() => toast("לא נשמר"));
  }
  else if (t.id === "showAll") { S.showAll = !S.showAll; render(); }
  else if (t.id === "moreBtn") { S.sheet = { type: "more" }; render(); }
  else if (t.id === "send") sendOrder();
  else if (d.range) { S.range = +d.range; S.histAll = false; loadData(); }
  else if (d.orow) { S.openRow = S.openRow === d.orow ? null : d.orow; render(); }
  else if (d.oday) { S.openDay = S.openDay === d.oday ? null : d.oday; render(); }
  else if (d.delw) { if (confirm("למחוק את רישום הפחת?")) deleteDoc(doc(db, "waste", d.delw)).then(() => { S.data.waste = S.data.waste.filter((w) => w.id !== d.delw); render(); toast("נמחק"); }).catch(() => toast("לא נמחק")); }
  else if (t.id === "advBtn") { S.adv = !S.adv; render(); }
  else if (t.id === "histAll") { S.histAll = true; render(); }
  else if (d.log) { S.sheet = { type: "log", day: d.log }; render(); }
  else if (d.cancel) { S.sheet = { type: "cancel", day: d.cancel }; render(); }
  else if (t.id === "sCancelOk") cancelOrder(sh.day, (($("cnote") || {}).value || "").trim());
  else if (d.uncancel) uncancelOrder(d.uncancel);
  else if (t.id === "resetBtn") openReset();
  else if (t.id === "backupBtn") backupAll();
  else if (t.id === "sResetOk") doReset((($("rpw") || {}).value || ""));
  else if (t.id === "expText") copyText();
  else if (t.id === "expOrders") exportCSV("orders");
  else if (t.id === "expWaste") exportCSV("waste");
});
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); }
  else if (t.id === "note") saveNote(t.value);
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.days) { const d = parseInt(t.value, 10); if (d > 0) catWrite(t.dataset.days, { d }); }
  else if (t.dataset.role) setRole(t.dataset.role, t.value);
  else if (t.id === "wk" && S.sheet) { S.sheet.k = t.value; }
});
/* לחיצה ארוכה על הכנה בהזמנה ← הערה לאותה הכנה */
let lp = null;
app.addEventListener("pointerdown", (e) => {
  if (!can.order() || S.tab !== "order" || e.target.closest("button")) return;
  const row = e.target.closest(".row[data-k]"); if (!row) return;
  const x = e.clientX, y = e.clientY;
  lp = { x, y, t: setTimeout(() => { lp = null; if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} S.sheet = { type: "inote", k: row.dataset.k }; render(); const i = $("inoteIn"); if (i) i.focus(); }, 550) };
});
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => app.addEventListener(ev, () => { if (lp) { clearTimeout(lp.t); lp = null; } }));
app.addEventListener("pointermove", (e) => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.t); lp = null; } });
window.addEventListener("scroll", () => { if (lp) { clearTimeout(lp.t); lp = null; } }, { passive: true });
app.addEventListener("contextmenu", (e) => { if (e.target.closest(".row[data-k]") && S.tab === "order") e.preventDefault(); });
function chartTip(e) { const g = e.target.closest && e.target.closest(".b"); if (!g) return; const box = g.closest(".chartbox"); box.querySelector(".ctip").textContent = g.dataset.tip; box.querySelectorAll(".b.on").forEach((x) => x.classList.remove("on")); g.classList.add("on"); }
app.addEventListener("pointerover", chartTip);
app.addEventListener("pointerdown", chartTip);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
setInterval(() => { remindTick(); const a = document.activeElement; if (S.user && !S.sheet && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"))) render(); }, 30000);
window.addEventListener("online", () => render());
window.addEventListener("offline", () => render());
window.addEventListener("beforeunload", () => { if (Object.keys(pending).length) flush(); runAutoNow(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { flush(); runAutoNow(); } });
render();

</script>
</body>
