# מעבר לפרויקט החדש (mizo-db6f7): כל הנתונים + חשבונות הכניסה עם אותן סיסמאות. בשחרור: .github/workflows/migrate.yml במאגר החי
# Actions ← "מעבר לפרויקט החדש" ← Run workflow. ברירת מחדל = תוכנית בלבד. הסבר מלא: docs/migration.md
name: מעבר לפרויקט החדש
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "להעתיק באמת? (בלי סימון = תוכנית בלבד)"
        type: boolean
        default: false
      confirm:
        description: "להעתקה: להקליד mizo-db6f7"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server  # קבצי השרת בתיקיית server/ (לא באתר)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --silent
      - name: Migrate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_MIZO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIZO }}
          OLD_HASH_KEY: ${{ secrets.OLD_HASH_KEY }}
          OLD_SALT_SEPARATOR: ${{ secrets.OLD_SALT_SEPARATOR }}
          OLD_ROUNDS: ${{ secrets.OLD_ROUNDS }}
          OLD_MEM_COST: ${{ secrets.OLD_MEM_COST }}
          MIZO_VAPID: ${{ vars.MIZO_VAPID }}
          MIGRATE_CONFIRM: ${{ inputs.confirm }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          if [ "$IN_APPLY" = "true" ]; then node migrate.mjs --apply; else node migrate.mjs; fi
