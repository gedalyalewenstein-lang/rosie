name: התראות רוזי
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}  # כל משימה מקבלת רק מה שהיא צריכה
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  # רשימת המסעדות: רוזי וג'קו + כל מסעדה שנוספה מחדר הבקרה (siteRegistry). תקלה → רוזי וג'קו בלבד
  sites:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server  # קבצי השרת בתיקיית server/ (לא באתר)
    timeout-minutes: 3
    outputs:
      list: ${{ steps.s.outputs.list || '["rosie","jaco"]' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --silent  # גרסה מדויקת מ-package-lock.json
      - id: s
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sites.mjs
  notify:
    needs: sites
    if: always()
    permissions:
      contents: write  # רק בשביל "Keep schedule alive" (commit אחד כל 40 יום)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server  # קבצי השרת בתיקיית server/ (לא באתר)
    timeout-minutes: 9
    # אותו שרת לכל מסעדה, במקביל. הנתונים של כל מסעדה נפרדים
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.list || '["rosie","jaco"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --silent  # גרסה מדויקת מ-package-lock.json
      - name: Send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SITE: ${{ matrix.site }}
          APP_URL: ${{ vars.APP_URL }}  # בפרויקט של מיזו: https://mizoik.co.il/ (ריק = הכתובת הנוכחית)
        run: node notify.mjs
      - name: Keep schedule alive
        if: matrix.site == 'rosie'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3456000 ]; then
            git config user.name "rosie-bot"; git config user.email "bot@users.noreply.github.com"
            date -u > .keepalive; git add .keepalive; git commit -m "keepalive"; git push
          fi
